<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>AFL SuperCard</title>
<style>
:root{--gold:#FFD200;--blue:#4aa3ff;--bg:#07090d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
#app{height:100dvh;position:relative;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
 background:radial-gradient(90% 50% at 50% 0%,rgba(255,210,0,.14),transparent 70%),radial-gradient(120% 70% at 50% 120%,#14110a,#07090d 60%)}
.screen{position:absolute;inset:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;display:none;flex-direction:column}
.screen.on{display:flex}
h1,h2,h3,p{margin:0}
.top{padding:14px 18px 6px;text-align:center}
.top h1{font-size:13px;letter-spacing:.22em;text-transform:uppercase;opacity:.7;font-weight:800}
.top p{font-size:12px;opacity:.5;margin-top:3px}
.bar-btns{display:grid;gap:10px;padding:8px 16px 16px}
.btn{height:62px;border:0;border-radius:20px;font-size:18px;font-weight:900;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.13);transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.main{background:linear-gradient(180deg,#ffe24d,#e6b800);color:#201800;box-shadow:0 8px 24px rgba(255,200,0,.28)}
.btn[disabled]{opacity:.35}
/* cards */
.mc{--c1:#e5ebf0;--c2:#4b5560;position:relative;width:var(--w,90px);aspect-ratio:3/4;border-radius:13px;padding:3px;background:linear-gradient(145deg,var(--c1),var(--c2) 55%,var(--c1));box-shadow:0 8px 18px rgba(0,0,0,.5),0 0 14px var(--gl,transparent);flex:none}
.mc .in{position:relative;height:100%;border-radius:10px;overflow:hidden;background:radial-gradient(80% 60% at 70% 30%,rgba(255,210,0,.18),transparent),#0b0b0d}
.mc .ph{position:absolute;inset:0;background-size:cover;background-position:50% 22%}
.mc .ph.tall{background-size:150%;background-position:50% 8%}
.mc .ini{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:calc(var(--w,90px)*.34);opacity:.35}
.mc .sh{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 35%,transparent 58%,rgba(0,0,0,.92))}
.mc .ov{position:absolute;left:5px;top:1px;font-weight:900;font-style:italic;font-size:calc(var(--w,90px)*.32);line-height:1;color:#fff;text-shadow:0 2px 5px #000;letter-spacing:-.02em}
.mc .ps{position:absolute;left:6px;top:calc(var(--w,90px)*.32 + 3px);font-size:calc(var(--w,90px)*.11);font-weight:800;letter-spacing:.1em;opacity:.9;text-shadow:0 1px 3px #000}
.mc .nm{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-weight:900;font-style:italic;text-transform:uppercase;font-size:calc(var(--w,90px)*.14);letter-spacing:.02em;text-shadow:0 2px 4px #000;white-space:nowrap;overflow:hidden;padding:0 2px}
.diamond{--c1:#e4faff;--c2:#2a7fb0;--gl:rgba(90,205,255,.4)}.ruby{--c1:#ff8d9b;--c2:#7e0f22;--gl:rgba(224,38,63,.4)}
.amethyst{--c1:#e6c2ff;--c2:#5d2aa6;--gl:rgba(168,85,247,.4)}.sapphire{--c1:#9db9ff;--c2:#1b3f9e;--gl:rgba(47,109,240,.4)}
.emerald{--c1:#8ff0bb;--c2:#0c6b3c;--gl:rgba(31,184,106,.35)}.topaz{--c1:#ffd27a;--c2:#9a5b00;--gl:rgba(242,165,22,.35)}
.quartz{--c1:#e5ebf0;--c2:#4b5560}
/* lineup */
.form{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 10px}
.cap{text-align:center;font-size:11px;letter-spacing:.2em;opacity:.55;font-weight:800;margin-bottom:6px}
.rowc{display:flex;justify-content:center;gap:12px}
.slot{background:none;border:0;padding:0;color:inherit}
.slot.empty .mc{opacity:.35}
.slot .tag{position:absolute;right:-4px;top:-6px;background:var(--gold);color:#111;font-size:9px;font-weight:900;border-radius:6px;padding:2px 5px;z-index:2}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet .box{width:100%;max-height:78%;display:flex;flex-direction:column;background:#12141a;border-radius:24px 24px 0 0;padding:14px 14px 14px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sheet h3{text-align:center;font-size:13px;letter-spacing:.18em;opacity:.7;margin-bottom:10px}
.list{overflow:auto;flex:1;display:grid;gap:8px;padding-bottom:10px}
.pr{display:flex;align-items:center;gap:12px;border:0;color:#fff;text-align:left;background:rgba(255,255,255,.07);border-radius:14px;padding:6px 12px 6px 6px;width:100%}
.pr .t{flex:1}.pr b{display:block;font-size:16px}.pr small{opacity:.55;font-size:11px;letter-spacing:.1em}
.pr .o{font-size:26px;font-weight:900;font-style:italic}
.pr.used{opacity:.55}
/* match */
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 14px 6px;gap:6px}
.tm{text-align:center}.tm small{display:block;font-size:10px;letter-spacing:.2em;font-weight:900;opacity:.8}
.tm b{display:block;font-size:30px;font-weight:900;line-height:1.1}.tm span{font-size:12px;opacity:.6}
.tm.me small{color:var(--gold)}.tm.cpu small{color:var(--blue)}
.qb{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;font-weight:900;letter-spacing:.1em;font-size:14px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 14px}
.crow{display:flex;justify-content:center;gap:8px;--w:64px}
.ttl{text-align:center;font-size:12px;font-weight:900;letter-spacing:.18em;opacity:.75;min-height:16px}
.stats{display:grid;gap:9px}
.sr{opacity:0;transform:translateY(6px);transition:.35s}.sr.show{opacity:1;transform:none}
.sr .h{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;font-size:13px;font-weight:700;text-align:center}
.sr .h b{font-size:18px;font-weight:900}.sr .h b:first-child{color:var(--gold);text-align:left}.sr .h b:last-child{color:var(--blue);text-align:right}
.sr .h span{opacity:.8;letter-spacing:.04em}
.sr .bar{height:9px;border-radius:5px;background:var(--blue);margin-top:4px;overflow:hidden;display:flex}
.sr .bar i{display:block;height:100%;width:50%;background:var(--gold);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.sr.wm .h b:first-child::after{content:" ✔";font-size:12px}.sr.wc .h b:last-child::before{content:"✔ ";font-size:12px}
.sr.wm .bar{box-shadow:0 0 12px rgba(255,210,0,.5)}.sr.wc .bar{box-shadow:0 0 12px rgba(74,163,255,.5)}
.ban{text-align:center;font-size:18px;font-weight:900;min-height:48px;display:grid;place-items:center;opacity:0;transition:.3s;padding:0 8px;line-height:1.15}
.ban.show{opacity:1}.ban small{display:block;font-size:12px;opacity:.6;font-weight:700;margin-top:3px}
.qs{display:grid;gap:8px;padding:4px 4px}
.qs .l{display:flex;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:12px;padding:9px 12px;font-size:14px}
.qs .l.m b{color:var(--gold)}.qs .l.c b{color:var(--blue)}
.big{font-size:40px;font-weight:900;text-align:center;line-height:1}
/* result */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 20px;text-align:center}
.res h2{font-size:56px;font-weight:900;font-style:italic;letter-spacing:.02em}
.res .sc{font-size:22px;font-weight:800}.res .sc span{opacity:.5;font-size:14px;display:block;margin-top:2px}
.pill{background:rgba(255,255,255,.1);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:800;letter-spacing:.05em}
.tops{display:flex;gap:8px;justify-content:center}
</style>
</head>
<body>
<div id="app">
 <!-- LINE-UP -->
 <section class="screen on" id="sLine">
  <div class="top"><h1>Set your 7</h1><p>Tap a card to swap. Centre is your ruck.</p></div>
  <div class="form" id="form"></div>
  <div class="bar-btns" style="grid-template-columns:110px 1fr"><button class="btn" id="auto">AUTO</button><button class="btn main" id="play">PLAY MATCH ▶</button></div>
  <div class="sheet" id="sheet"><div class="box"><h3 id="shTitle"></h3><div class="list" id="shList"></div><button class="btn" id="shClose">CANCEL</button></div></div>
 </section>
 <!-- MATCH -->
 <section class="screen" id="sMatch">
  <div class="sb">
   <div class="tm me"><small>YOUR TEAM</small><b id="sMe">0.0</b><span id="sMeT">0</span></div>
   <div class="qb" id="qb">Q1</div>
   <div class="tm cpu"><small>CHALLENGERS</small><b id="sCpu">0.0</b><span id="sCpuT">0</span></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bar-btns"><button class="btn main" id="go">CENTRE BOUNCE</button></div>
 </section>
 <!-- RESULT -->
 <section class="screen" id="sRes">
  <div class="res" id="resBody"></div>
  <div class="bar-btns"><button class="btn main" id="again">PLAY AGAIN</button><button class="btn" id="toLine">CHANGE LINE-UP</button></div>
 </section>
</div>
<script src="players.js"></script>
<script>
(function(){
var ST=window.ST,PL=window.PL,S={};ST.forEach(function(n,i){S[n]=i});
var GIVEN={"Toby Nankervis":"RUC","Marcus Bontempelli":"MID","Nick Vlastuin":"DEF","Jacob Hopper":"MID","Dion Prestia":"MID","Sam Lalor":"FWD","Jack Ross":"MID","Sam Banks":"DEF","Rhyan Mansell":"FWD","Jonty Faull":"FWD","Taj Hotton":"FWD","Luke Trainor":"DEF","Ben Miller":"DEF","Hugo Ralphsmith":"FWD","Tim Taranto":"MID","Jayden Short":"DEF","Maurice Rioli":"FWD","Josh Gibcus":"DEF","Tom Lynch":"FWD","Noah Balta":"DEF","Sam Cumming":"MID","Judson Clarke":"MID","Sam Grlj":"DEF"};
function tierOf(o){return o>=90?"diamond":o>=85?"ruby":o>=80?"amethyst":o>=75?"sapphire":o>=70?"emerald":o>=65?"topaz":"quartz"}
var POOL=[];
PL.forEach(function(p,i){if(!GIVEN[p[0]])return;var pr=p[0].split(" "),f=pr[0],l=pr.slice(1).join(" ");
 POOL.push({id:POOL.length,name:p[0],first:f,last:l,pos:GIVEN[p[0]],o:p[3],s:p[4],t:tierOf(p[3]),
  img:"assets/players/"+l.toLowerCase().replace(/[^a-z]/g,"")+"-"+f.toLowerCase()+".jpg",tall:/Bontempelli/.test(p[0])})});
POOL.sort(function(a,b){return b.o-a.o});POOL.forEach(function(c,i){c.id=i});
var ROLES=["FWD","FWD","MID","RUC","MID","DEF","DEF"];           // slot roles
var LINEW=[1,1,.35,.35,.35,.05,.05];                              // who takes the shots
var me=[null,null,null,null,null,null,null],cpu=null;
var $=function(i){return document.getElementById(i)};
function show(id){["sLine","sMatch","sRes"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function pick3(a){a=a.slice();var o=[];for(var i=0;i<3;i++)o.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);return o}
function card(c,w,tag){if(!c)return'<div class="mc" style="--w:'+w+'px"><div class="in"><div class="ini">+</div></div></div>';
 return'<div class="mc '+c.t+'" style="--w:'+w+'px">'+(tag?'<div class="tag">'+tag+'</div>':'')+'<div class="in"><div class="ini">'+c.first[0]+c.last[0]+'</div><div class="ph'+(c.tall?' tall':'')+'" style="background-image:url('+c.img+')"></div><div class="sh"></div><div class="ov">'+c.o+'</div><div class="ps">'+c.pos+'</div><div class="nm">'+c.last+'</div></div></div>'}
/* ---------- auto pick ---------- */
function autoPick(avail,order){var out=[null,null,null,null,null,null,null],left=avail.slice();
 function take(slot,pos){var best=null;left.forEach(function(c){if(pos&&c.pos!==pos)return;if(!best||c.o>best.o)best=c});
  if(!best)left.forEach(function(c){if(!best||c.o>best.o)best=c});
  if(best){out[slot]=best;left.splice(left.indexOf(best),1)}}
 [[3,"RUC"],[5,"DEF"],[6,"DEF"],[0,"FWD"],[1,"FWD"],[2,"MID"],[4,"MID"]].forEach(function(x){take(x[0],x[1])});return out}
/* ---------- lineup screen ---------- */
var editing=-1;
function drawLine(){var rows=[["FORWARDS",[0,1]],["MIDFIELD  ·  CENTRE = RUCK",[2,3,4]],["BACKS",[5,6]]];
 $("form").innerHTML=rows.map(function(r){return'<div><div class="cap">'+r[0]+'</div><div class="rowc">'+r[1].map(function(i){
  return'<button class="slot" data-i="'+i+'">'+card(me[i],i===3?96:86,i===3?"RUCK":"")+'</button>'}).join("")+'</div></div>'}).join("");
 [].forEach.call($("form").querySelectorAll(".slot"),function(b){b.onclick=function(){openSheet(+b.dataset.i)}})}
function openSheet(i){editing=i;$("shTitle").textContent="PICK "+ROLES[i]+" · TAP TO PLACE";
 $("shList").innerHTML=POOL.map(function(c){var used=me.indexOf(c);return'<button class="pr'+(used>=0&&used!==i?' used':'')+'" data-id="'+c.id+'">'+card(c,46)+'<div class="t"><b>'+c.name+'</b><small>'+c.pos+(used>=0?' · IN LINE-UP':'')+'</small></div><div class="o">'+c.o+'</div></button>'}).join("");
 [].forEach.call($("shList").querySelectorAll(".pr"),function(b){b.onclick=function(){var c=POOL[+b.dataset.id],u=me.indexOf(c);if(u>=0)me[u]=me[editing];me[editing]=c;closeSheet();drawLine()}});
 $("sheet").classList.add("on")}
function closeSheet(){$("sheet").classList.remove("on")}
$("shClose").onclick=closeSheet;$("sheet").onclick=function(e){if(e.target===$("sheet"))closeSheet()};
$("auto").onclick=function(){me=autoPick(POOL);drawLine()};
/* ---------- match engine ---------- */
var MIDPOOL=["Contested","Uncontested","Clearance","Inside 50","Tackling","Disposal","Kicking","Handball","Run","Hit-out","Ball security"];
var PAIRS=[["Forward mark","Spoil"],["Contested mark","Marking"],["Scoring","Rebound"],["Accuracy","Discipline"],["Kicking","Tackling"]];
function avg(cs,k){var i=S[k];return cs.reduce(function(a,c){return a+c.s[i]},0)/cs.length}
function nx(a,b){return Math.max(-1,Math.min(1,(a-b)/(a+b)*4))}
function gauss(){var u=1-Math.random(),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function gamma4(th){var s=0;for(var i=0;i<4;i++)s+=-Math.log(1-Math.random());return s*th}
function poisson(l){var L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
var G;   // game state
function newGame(){G={q:0,me:{g:0,b:0},cpu:{g:0,b:0},step:"bounce",scorers:{me:{},cpu:{}},cur:null}}
function mids(t){return[t[2],t[3],t[4]]}function fwds(t){return[t[0],t[1]]}function backs(t){return[t[5],t[6]]}
function shoot(team,gap,shift){var mean=Math.max(.8,6.2*(1+.8*gap))*Math.exp(gauss()*.3),n=poisson(gamma4(mean/4)),ev=[];
 var w=team.map(function(c,i){return Math.pow(c.s[S["Scoring"]],2)*LINEW[i]}),tot=w.reduce(function(a,b){return a+b},0);
 for(var k=0;k<n;k++){var r=Math.random()*tot,i=0;while(i<6&&r>w[i]){r-=w[i];i++}
  var p=Math.max(.15,Math.min(.8,.32+.30*(team[i].s[S["Accuracy"]]-35)/64+shift));ev.push({c:team[i],goal:Math.random()<p})}
 return ev}
function simQuarter(){var rc=pick3(MIDPOOL).map(function(k){var a=avg(mids(me),k),b=avg(mids(cpu),k);
  return{k:k,a:a,b:b,x:nx(a,b),w:a>b?"m":a<b?"c":(Math.random()<.5?"m":"c")}});
 var meClr=rc.filter(function(r){return r.w==="m"}).length>=2,gMid=rc.reduce(function(s,r){return s+r.x},0)/3;
 var A=meClr?me:cpu,D=meClr?cpu:me;
 var rn=pick3(PAIRS).map(function(pr){var att=avg(fwds(A),pr[0]),def=avg(backs(D),pr[1]),aw=att>def;
  var left=meClr?att:def,right=meClr?def:att,lab=meClr?pr[0]+" v "+pr[1]:pr[1]+" v "+pr[0];
  var mw=meClr?aw:!aw;return{k:lab,a:left,b:right,x:nx(att,def),w:mw?"m":"c",aw:aw}});
 var attWins=rn.filter(function(r){return r.aw}).length>=2,gNext=rn.reduce(function(s,r){return s+r.x},0)/3;
 var g=.4*gMid+.6*(meClr?gNext:-gNext)+(meClr?.1:-.1)+((attWins===meClr)?.15:-.15);
 if(G.q===3){var m=G.me.g*6+G.me.b-G.cpu.g*6-G.cpu.b;if(Math.abs(m)>30)g+=m<0?.25:-.15*1}
 if(G.q===3){var mm=G.me.g*6+G.me.b-G.cpu.g*6-G.cpu.b;if(mm>30)g-=.15-.15*0}
 var sm=gauss()*.07,sc=gauss()*.07,em=shoot(me,g,sm),ec=shoot(cpu,-g,sc),Q={meClr:meClr,attWins:attWins,rc:rc,rn:rn,me:{g:0,b:0},cpu:{g:0,b:0},ev:[]};
 function tally(ev,side){ev.forEach(function(e){var t=Q[side],s=G.scorers[side];if(e.goal){t.g++;G[side].g++}else{t.b++;G[side].b++}
  var o=s[e.c.last]||(s[e.c.last]={g:0,b:0,c:e.c});if(e.goal)o.g++;else o.b++})}
 tally(em,"me");tally(ec,"cpu");return Q}
/* ---------- match UI ---------- */
function pts(t){return t.g*6+t.b}
function scoreboard(){$("sMe").textContent=G.me.g+"."+G.me.b;$("sMeT").textContent=pts(G.me);$("sCpu").textContent=G.cpu.g+"."+G.cpu.b;$("sCpuT").textContent=pts(G.cpu);
 $("qb").textContent=G.q>=4?"FT":"Q"+Math.max(1,G.q)}
function crow(cs){return'<div class="crow">'+cs.map(function(c){return card(c,64)}).join("")+'</div>'}
function rowsHTML(rows){return'<div class="stats">'+rows.map(function(r,i){return'<div class="sr" id="sr'+i+'"><div class="h"><b>'+Math.round(r.a)+'</b><span>'+r.k+'</span><b>'+Math.round(r.b)+'</b></div><div class="bar"><i></i></div></div>'}).join("")+'</div>'}
function revealRows(rows,cb){rows.forEach(function(r,i){setTimeout(function(){var el=$("sr"+i);if(!el)return;el.classList.add("show");el.classList.add(r.w==="m"?"wm":"wc");
  setTimeout(function(){el.querySelector("i").style.width=(r.a/(r.a+r.b)*100)+"%"},60)},500+i*750)});
 setTimeout(cb,500+rows.length*750+250)}
function stage(topT,topC,rows,botC,botT){$("stage").innerHTML='<div class="ttl">'+topT+'</div>'+crow(topC)+rowsHTML(rows)+crow(botC)+'<div class="ttl">'+botT+'</div><div class="ban" id="ban"></div>'}
function banner(h,s){var b=$("ban");b.innerHTML=h+(s?'<small>'+s+'</small>':"");b.classList.add("show")}
function busy(on,label){$("go").disabled=on;if(label)$("go").textContent=label}
function scorerLines(Q){var all={};Q.ev&&0;return""}
$("go").onclick=function(){
 if(G.step==="bounce"){G.q++;scoreboard();G.cur=simQuarter();var Q=G.cur;busy(true);
  stage("CHALLENGERS MIDFIELD",mids(cpu),Q.rc,mids(me),"YOUR MIDFIELD");
  revealRows(Q.rc,function(){banner(Q.meClr?"YOU WIN THE CLEARANCE":"CHALLENGERS WIN THE CLEARANCE",Q.meClr?"You go forward":"You have to defend");G.step="next";busy(false,"NEXT PLAY ▶")})}
 else if(G.step==="next"){var Q=G.cur;busy(true);
  if(Q.meClr)stage("CHALLENGERS BACKS",backs(cpu),Q.rn,fwds(me),"YOUR FORWARDS ATTACK");
  else stage("CHALLENGERS FORWARDS ATTACK",fwds(cpu),Q.rn,backs(me),"YOUR BACKS DEFEND");
  revealRows(Q.rn,function(){var win=Q.meClr?Q.attWins:!Q.attWins;banner(win?"YOU WIN THE PLAY":"THEY WIN THE PLAY",Q.attWins?"Attackers break through":"Defenders hold firm");G.step="qscore";busy(false,"QUARTER "+G.q+" SCORE ▶")})}
 else if(G.step==="qscore"){var Q=G.cur;scoreboard();
  var lines=[];["me","cpu"].forEach(function(side){Object.keys(G.scorers[side]).forEach(function(n){});});
  var qe=Q.ev;function who(side){return""}
  $("stage").innerHTML='<div class="ttl">QUARTER '+G.q+' RESULT</div><div class="qs"><div class="l m"><span>YOUR TEAM</span><b>'+Q.me.g+'.'+Q.me.b+' ('+pts(Q.me)+')</b></div><div class="l c"><span>CHALLENGERS</span><b>'+Q.cpu.g+'.'+Q.cpu.b+' ('+pts(Q.cpu)+')</b></div></div>'
   +'<div class="big">'+pts(G.me)+' – '+pts(G.cpu)+'</div><div class="ttl">'+(pts(G.me)>pts(G.cpu)?"YOU LEAD":pts(G.me)<pts(G.cpu)?"YOU TRAIL":"ALL SQUARE")+' AFTER Q'+G.q+'</div>';
  if(G.q>=4){G.step="final";$("go").textContent="FULL TIME ▶"}else{G.step="bounce";$("go").textContent="QUARTER "+(G.q+1)+" · BOUNCE ▶"}}
 else if(G.step==="final"){finish()}
};
function startMatch(){var used=me.filter(Boolean);if(used.length<7){me=autoPick(POOL)}
 if(!cpu)cpu=autoPick(POOL.filter(function(c){return me.indexOf(c)<0}));
 newGame();scoreboard();$("stage").innerHTML='<div class="ttl">CHALLENGERS</div>'+crow(mids(cpu))+'<div class="ban show" style="font-size:22px">4 QUARTERS.<small>Win the clearance, then beat their backs.</small></div>'+crow(mids(me))+'<div class="ttl">YOUR TEAM</div>';
 $("go").textContent="CENTRE BOUNCE";busy(false);show("sMatch")}
$("play").onclick=function(){cpu=autoPick(POOL.filter(function(c){return me.indexOf(c)<0}));startMatch()};
function finish(){var a=pts(G.me),b=pts(G.cpu),res=a>b?"WIN":a<b?"LOSS":"DRAW",st=0;
 try{st=+localStorage.getItem("afl_streak")||0;st=res==="WIN"?st+1:res==="LOSS"?0:st;localStorage.setItem("afl_streak",st)}catch(e){}
 var all=[];Object.keys(G.scorers.me).forEach(function(n){var o=G.scorers.me[n];all.push(o)});all.sort(function(x,y){return y.g*6+y.b-(x.g*6+x.b)});
 var top=all.slice(0,3);
 $("resBody").innerHTML='<h2 style="color:'+(res==="WIN"?"var(--gold)":res==="LOSS"?"#ff6b6b":"#fff")+'">'+res+'</h2><div class="sc">'+G.me.g+'.'+G.me.b+' ('+a+') &nbsp;v&nbsp; '+G.cpu.g+'.'+G.cpu.b+' ('+b+')<span>'+(a===b?"Dead heat":"Margin "+Math.abs(a-b)+" points")+'</span></div>'
  +'<div class="tops">'+top.map(function(o){return'<div style="text-align:center">'+card(o.c,74)+'<div class="pill" style="margin-top:8px">'+o.g+'.'+o.b+'</div></div>'}).join("")+'</div>'
  +'<div class="pill">WIN STREAK '+st+'</div>';
 show("sRes")}
$("again").onclick=function(){cpu=autoPick(POOL.filter(function(c){return me.indexOf(c)<0}));startMatch()};
$("toLine").onclick=function(){drawLine();show("sLine")};
me=autoPick(POOL);drawLine();
window.__dbg={get G(){return G},me:function(){return me},POOL:POOL};
})();
</script>
