<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe600">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>AFL SuperCard</title>
<style>
:root{--gold:#FFD200;--blue:#4aa3ff;--bg:#07090d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
#app{height:100dvh;position:relative;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
 background:radial-gradient(90% 50% at 50% 0%,rgba(255,210,0,.14),transparent 70%),radial-gradient(120% 70% at 50% 120%,#14110a,#07090d 60%)}
.screen{position:absolute;inset:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;display:none;flex-direction:column}
.screen.on{display:flex}
h1,h2,h3,p{margin:0}
.top{padding:14px 18px 6px;text-align:center}
.top h1{font-size:13px;letter-spacing:.22em;text-transform:uppercase;opacity:.7;font-weight:800}
.top p{font-size:12px;opacity:.5;margin-top:3px}
.bar-btns{display:grid;gap:10px;padding:8px 16px 16px}
.btn{height:62px;border:0;border-radius:20px;font-size:18px;font-weight:900;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.13);transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.main{background:linear-gradient(180deg,#ffe24d,#e6b800);color:#201800;box-shadow:0 8px 24px rgba(255,200,0,.28)}
.btn[disabled]{opacity:.35}
/* cards */
.mc{--c1:#e5ebf0;--c2:#4b5560;position:relative;width:var(--w,90px);aspect-ratio:3/4;border-radius:13px;padding:3px;background:linear-gradient(145deg,var(--c1),var(--c2) 55%,var(--c1));box-shadow:0 8px 18px rgba(0,0,0,.5),0 0 14px var(--gl,transparent);flex:none}
.mc .in{position:relative;height:100%;border-radius:10px;overflow:hidden;background:radial-gradient(80% 60% at 70% 30%,rgba(255,210,0,.18),transparent),#0b0b0d}
.mc .ph{position:absolute;inset:0;background-size:cover;background-position:50% 22%}
.mc .ph.tall{background-size:150%;background-position:50% 8%}
.mc .ini{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:calc(var(--w,90px)*.34);opacity:.35}
.mc .sh{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 35%,transparent 58%,rgba(0,0,0,.92))}
.mc .ov{position:absolute;left:5px;top:1px;font-weight:900;font-style:italic;font-size:calc(var(--w,90px)*.32);line-height:1;color:#fff;text-shadow:0 2px 5px #000;letter-spacing:-.02em}
.mc .ps{position:absolute;left:6px;top:calc(var(--w,90px)*.32 + 3px);font-size:calc(var(--w,90px)*.11);font-weight:800;letter-spacing:.1em;opacity:.9;text-shadow:0 1px 3px #000}
.mc .nm{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-weight:900;font-style:italic;text-transform:uppercase;font-size:calc(var(--w,90px)*.14);letter-spacing:.02em;text-shadow:0 2px 4px #000;white-space:nowrap;overflow:hidden;padding:0 2px}
.diamond{--c1:#e4faff;--c2:#2a7fb0;--gl:rgba(90,205,255,.4)}.ruby{--c1:#ff8d9b;--c2:#7e0f22;--gl:rgba(224,38,63,.4)}
.amethyst{--c1:#e6c2ff;--c2:#5d2aa6;--gl:rgba(168,85,247,.4)}.sapphire{--c1:#9db9ff;--c2:#1b3f9e;--gl:rgba(47,109,240,.4)}
.emerald{--c1:#8ff0bb;--c2:#0c6b3c;--gl:rgba(31,184,106,.35)}.topaz{--c1:#ffd27a;--c2:#9a5b00;--gl:rgba(242,165,22,.35)}
.quartz{--c1:#e5ebf0;--c2:#4b5560}
/* premium cards */
.diamond{--bg:radial-gradient(90% 60% at 50% 34%,#e6fbff 0%,#5cc2ff 32%,#1c4fd8 66%,#0a1346 100%);--ring:linear-gradient(160deg,#fff,#7fdcff 45%,#1c4fd8)}
.ruby{--bg:linear-gradient(180deg,#1c0306 0%,#7c0d25 42%,#ff6a1a 100%);--ring:linear-gradient(160deg,#fff0c2,#ffb347 45%,#c0143c)}
.amethyst{--bg:radial-gradient(80% 60% at 50% 40%,#e69bff 0%,#7a2bd1 45%,#150a35 100%);--ring:linear-gradient(160deg,#fff,#d79bff 45%,#5b1fb0)}
.sapphire{--bg:radial-gradient(90% 60% at 50% 34%,#cfe0ff 0%,#4a7bff 40%,#10246b 100%);--ring:linear-gradient(160deg,#e0ecff,#7fa8ff 45%,#1b3f9e)}
.emerald{--bg:radial-gradient(90% 60% at 50% 34%,#d3ffe5 0%,#2fd88a 38%,#06432a 100%);--ring:linear-gradient(160deg,#d8ffe8,#5fe39a 45%,#0c6b3c)}
.topaz{--bg:radial-gradient(90% 60% at 50% 34%,#fff0a0 0%,#ffc21a 40%,#7a4a00 100%);--ring:linear-gradient(160deg,#fff7c4,#ffcf33 45%,#a86a00)}
.quartz{--bg:radial-gradient(90% 60% at 50% 34%,#f2f5f8 0%,#98a4b0 40%,#262c33 100%);--ring:linear-gradient(160deg,#fff,#c9d2da 45%,#4b5560)}
.mc .in{background:var(--bg,#111)}
.mc .in::before{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.38) 0 30%,transparent 30.3%),linear-gradient(205deg,rgba(255,255,255,.22) 0 26%,transparent 26.3%),repeating-conic-gradient(from 0deg at 50% 36%,rgba(255,255,255,.16) 0 3deg,transparent 3deg 14deg)}
.mc .ph{-webkit-mask-image:radial-gradient(ellipse 54% 58% at 50% 42%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 54% 58% at 50% 42%,#000 58%,transparent 100%);filter:drop-shadow(0 0 8px var(--gl,transparent))}
.mc .ph.cut{-webkit-mask-image:none;mask-image:none;background-size:contain;background-repeat:no-repeat;background-position:50% 100%;filter:drop-shadow(0 0 8px var(--gl,transparent)) drop-shadow(0 5px 7px rgba(0,0,0,.55))}
.mc .sil{position:absolute;left:30%;top:16%;width:40%;height:30%;border-radius:50%;background:rgba(8,12,34,.55)}
.mc .sil2{position:absolute;left:12%;top:48%;width:76%;height:60%;border-radius:50% 50% 0 0;background:rgba(8,12,34,.5)}
.mc .gl{position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.2) 48%,transparent 58%);mix-blend-mode:screen;pointer-events:none}
.dv{position:absolute;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:var(--ring);filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));z-index:3}
.dv i{position:absolute;inset:7%;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:radial-gradient(circle at 50% 30%,#2b3150,#0a0c14);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.9;font-style:normal;color:#fff}
.dv i b{font-weight:900;font-style:italic}.dv i small{font-weight:800;letter-spacing:.06em;opacity:.9}
.dv.on{background:linear-gradient(160deg,#fff7b0,#ffd24d 50%,#b78600);filter:drop-shadow(0 0 8px #ffd24d)}
.dv.on i b{color:#ffd24d}.dv.on.bl{background:linear-gradient(160deg,#d8ecff,#4aa3ff 50%,#1b4f8f);filter:drop-shadow(0 0 8px #4aa3ff)}.dv.on.bl i b{color:#7cc0ff}
.mc .row4{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;z-index:3}
.mc .nm{z-index:3}
/* lineup */
.form{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 10px}
.cap{text-align:center;font-size:11px;letter-spacing:.2em;opacity:.55;font-weight:800;margin-bottom:6px}
.rowc{display:flex;justify-content:center;gap:12px}
.slot{background:none;border:0;padding:0;color:inherit}
.slot.empty .mc{opacity:.35}
.slot .tag{position:absolute;right:-4px;top:-6px;background:var(--gold);color:#111;font-size:9px;font-weight:900;border-radius:6px;padding:2px 5px;z-index:2}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet .box{width:100%;max-height:78%;display:flex;flex-direction:column;background:#12141a;border-radius:24px 24px 0 0;padding:14px 14px 14px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sheet h3{text-align:center;font-size:13px;letter-spacing:.18em;opacity:.7;margin-bottom:10px}
.list{overflow:auto;flex:1;display:grid;gap:8px;padding-bottom:10px}
.pr{display:flex;align-items:center;gap:12px;border:0;color:#fff;text-align:left;background:rgba(255,255,255,.07);border-radius:14px;padding:6px 12px 6px 6px;width:100%}
.pr .t{flex:1}.pr b{display:block;font-size:16px}.pr small{opacity:.55;font-size:11px;letter-spacing:.1em}
.pr .o{font-size:26px;font-weight:900;font-style:italic}
.pr.used{opacity:.55}
/* match */
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px 2px;gap:6px}
.tm{text-align:center}.tm small{display:block;font-size:10px;letter-spacing:.2em;font-weight:900;opacity:.8}
.tm b{display:block;font-size:28px;font-weight:900;line-height:1.1}.tm span{font-size:12px;opacity:.6}
.tm.me small{color:var(--gold)}.tm.cpu small{color:var(--blue)}
.qb{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;font-weight:900;letter-spacing:.1em;font-size:14px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 10px 10px}
.ttl{text-align:center;font-size:12px;font-weight:900;letter-spacing:.18em;opacity:.8;min-height:16px}
.opp{display:grid;place-items:center;min-height:0}
.mine{display:flex;justify-content:center;gap:10px;width:100%}
.mine button{background:none;border:0;padding:0;color:inherit;transition:transform .15s,opacity .2s}
.mine button:active{transform:scale(.95)}
.mine button.used{opacity:.3;pointer-events:none;filter:grayscale(1)}
.mine button.lock{pointer-events:none}
.mc.win{box-shadow:0 0 0 3px var(--gold),0 0 30px rgba(255,210,0,.7);transform:translateY(-6px) scale(1.04)}
.mc.lose{opacity:.55;filter:grayscale(.6)}
.mc.cwin{box-shadow:0 0 0 3px var(--blue),0 0 30px rgba(74,163,255,.7);transform:translateY(-6px) scale(1.04)}
.mc{transition:transform .3s,box-shadow .3s,opacity .3s}
.mc.back .in{background:repeating-linear-gradient(45deg,#14161d 0 6px,#1b1e27 6px 12px)}
.mc.back .in::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w,90px)*.5);font-weight:900;color:var(--blue);opacity:.8}
.mc.back{--c1:#8ec5ff;--c2:#1b4f8f}
.mc.back .in>*{visibility:hidden}
.mc.flip{animation:flip .55s ease-out}
@keyframes flip{0%{transform:rotateY(90deg) scale(.9)}100%{transform:none}}
.sv{position:absolute;left:0;right:0;bottom:calc(var(--w,90px)*.2);text-align:center;line-height:1;text-shadow:0 2px 6px #000}
.sv small{display:block;font-size:calc(var(--w,90px)*.085);font-weight:900;letter-spacing:.12em;opacity:.9;text-transform:uppercase}
.sv b{display:block;font-size:calc(var(--w,90px)*.34);font-weight:900;color:var(--gold)}
.sv.c b{color:var(--blue)}
.pips{display:flex;gap:8px;justify-content:center}
.pips i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18)}
.pips i.m{background:var(--gold);box-shadow:0 0 10px var(--gold)}.pips i.c{background:var(--blue);box-shadow:0 0 10px var(--blue)}
.ban{text-align:center;font-size:20px;font-weight:900;min-height:50px;display:grid;place-items:center;line-height:1.15;padding:0 8px}
.ban small{display:block;font-size:12px;opacity:.65;font-weight:700;margin-top:3px}
.pop{position:relative;display:grid;place-items:center;min-height:0}
.pop .tx{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:44px;font-weight:900;font-style:italic;text-shadow:0 4px 14px #000;animation:boom .5s ease-out}
.pop .tx.g{color:var(--gold)}.pop .tx.b{color:#cfd6df;font-size:30px}.pop .tx.cg{color:var(--blue)}
@keyframes boom{0%{transform:scale(2.2);opacity:0}100%{transform:none;opacity:1}}
.log{display:grid;gap:5px;width:100%;font-size:13px;font-weight:700}
.log div{display:flex;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:10px;padding:6px 10px}
.log .m b{color:var(--gold)}.log .c b{color:var(--blue)}
.qs{display:grid;gap:8px;width:100%}
.qs .l{display:flex;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;font-size:15px}
.qs .l.m b{color:var(--gold)}.qs .l.c b{color:var(--blue)}
.big{font-size:44px;font-weight:900;text-align:center;line-height:1}
/* result */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 20px;text-align:center}
.res h2{font-size:56px;font-weight:900;font-style:italic;letter-spacing:.02em}
.res .sc{font-size:22px;font-weight:800}.res .sc span{opacity:.5;font-size:14px;display:block;margin-top:2px}
.pill{background:rgba(255,255,255,.1);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:800;letter-spacing:.05em}
.tops{display:flex;gap:8px;justify-content:center}
.hide{display:none!important}
.sq{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:6px 8px}
.sqh{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;font-weight:900;margin-bottom:5px}.sqh b{color:var(--gold)}
.sqc{display:flex;gap:6px;justify-content:center}.pc,.hand button{background:none;border:0;padding:0;color:inherit}
.slot0{width:84px;aspect-ratio:3/4;border:2px dashed rgba(255,255,255,.22);border-radius:12px}
.hand{display:flex;gap:4px;justify-content:center;width:100%}
.hc.sel .mc{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold);transform:translateY(-8px)}
.rv{display:flex;gap:8px;justify-content:center}
.zone{position:absolute;top:0;bottom:0;background:rgba(255,210,0,.4);border:2px solid var(--gold);border-radius:12px}
.meter{position:relative;height:34px;width:92%;margin:8px auto 0;border-radius:17px;background:linear-gradient(90deg,#4a1f1f,#4a4a1f,#1f4a2b);border:2px solid rgba(255,255,255,.2)}
.meter i{position:absolute;top:-6px;bottom:-6px;width:8px;border-radius:4px;background:var(--gold);box-shadow:0 0 12px var(--gold);left:0;transform:translateX(-50%)}
</style>
<style>
/* ===== DIRECTION C · POSTER / STREET ===== */
:root{--gold:#ffe600;--blue:#ff2bb0;--cy:#00e5ff;--pk:#ff2bb0;--bg:#ffe600;--ht:radial-gradient(circle,rgba(0,0,0,.2) 1.6px,transparent 2px) 0 0/10px 10px;--AN:'Anton',Impact,'Arial Narrow',sans-serif}
html,body{background:#ffe600;font-family:'Space Grotesk',system-ui,sans-serif}
#app{background:#ffe600}
.screen>*:not(.sheet){position:relative;z-index:1}
.screen::before,.screen::after{content:"";position:absolute;pointer-events:none;z-index:0}
#sLine::before{left:0;right:0;top:34px;bottom:0;background:var(--ht),#00e5ff;clip-path:polygon(0 9%,100% 0,100% 100%,0 100%)}
#sMatch::before{left:0;right:0;top:92px;bottom:0;background:var(--ht),#ff2bb0}
#sMatch::after{left:0;right:0;top:49%;bottom:0;background:var(--ht),#00e5ff;clip-path:polygon(0 0,100% 44px,100% 100%,0 100%)}
#sRes::before{inset:0;background:repeating-conic-gradient(from 0deg at 50% 38%,#fff 0 8deg,transparent 8deg 20deg),#ffe600;opacity:.9}
#sRes::after{inset:0;background:var(--ht)}
.top{text-align:left;padding:18px 20px 0}
.top h1{font-family:var(--AN);font-size:58px;letter-spacing:.02em;line-height:1;opacity:1;color:#ffe600;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:5px 5px 0 #000;transform:rotate(-3deg);transform-origin:0 100%;font-weight:400;text-transform:uppercase}
.top p{font-size:13px;font-weight:700;opacity:1;color:#000;margin-top:8px}
.bar-btns{padding:8px 22px 20px;gap:14px}
.btn{height:66px;border:5px solid #000;border-radius:0;background:#fff;color:#000;font-family:var(--AN);font-weight:400;font-size:32px;letter-spacing:.05em;box-shadow:7px 7px 0 #000;transform:rotate(-1.2deg);transition:transform .08s,box-shadow .08s}
.btn.main{background:#ffe600;box-shadow:7px 7px 0 #000;color:#000}
.btn:active{transform:translate(5px,5px) rotate(-1.2deg);box-shadow:2px 2px 0 #000}
.cap{font-family:var(--AN);font-weight:400;font-size:17px;letter-spacing:.08em;opacity:1;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000;margin-bottom:8px}
.slot .tag{background:#ff2bb0;color:#fff;border:2px solid #000;border-radius:0;font-family:var(--AN);font-size:12px;font-weight:400;padding:1px 6px;right:-6px;top:-8px}
.rowc{gap:14px}
.rowc .slot:nth-child(odd) .mc{rotate:-1.6deg}.rowc .slot:nth-child(even) .mc{rotate:1.6deg}
/* cards */
.mc{border-radius:7px;padding:calc(var(--w,90px)*.022);background:#000;box-shadow:0 0 0 calc(var(--w,90px)*.012) #fff,calc(var(--w,90px)*.04) calc(var(--w,90px)*.04) 0 calc(var(--w,90px)*.012) #000}
.mc .in{border-radius:4px}
.mc .sh{background:var(--ht),linear-gradient(to bottom,rgba(0,0,0,.3),transparent 28%,transparent 52%,rgba(0,0,0,.92))}
.mc .nm{font-family:var(--AN);font-weight:400;font-style:normal;color:#fff;font-size:calc(var(--w,90px)*.19);letter-spacing:.02em;bottom:calc(var(--w,90px)*.02);-webkit-text-stroke:calc(var(--w,90px)*.014) #000;paint-order:stroke fill;text-shadow:calc(var(--w,90px)*.022) calc(var(--w,90px)*.022) 0 #000}
.dv{background:linear-gradient(160deg,#fff,#fff 40%,#cfcfcf)}
.dv.ov{background:linear-gradient(160deg,#fff97a,#ffe600 55%,#d8b800)}
.dv i{background:#000;font-family:var(--AN)}
.dv i b{font-weight:400;font-style:normal;letter-spacing:.01em}.dv i small{font-family:'Space Grotesk',sans-serif;font-weight:700}
.dv.on{background:linear-gradient(160deg,#fff,#ffe600 50%,#d8b800);filter:drop-shadow(0 0 8px #ffe600)}
.dv.on i{background:#ffe600}.dv.on i b{color:#000}
.dv.on.bl{background:linear-gradient(160deg,#fff,#ff7cd0 50%,#c4007f);filter:drop-shadow(0 0 8px #ff2bb0)}.dv.on.bl i{background:#ff2bb0}.dv.on.bl i b{color:#fff}
.mc .ov,.mc .ps{font-family:var(--AN);font-weight:400;font-style:normal}
.mc.win{box-shadow:0 0 0 calc(var(--w,90px)*.03) #ffe600,0 0 0 calc(var(--w,90px)*.05) #000,0 0 34px #ffe600;transform:translateY(-8px) scale(1.04)}
.mc.cwin{box-shadow:0 0 0 calc(var(--w,90px)*.03) #ff2bb0,0 0 0 calc(var(--w,90px)*.05) #000,0 0 34px #ff2bb0;transform:translateY(-8px) scale(1.04)}
.mc.lose{opacity:.7;filter:grayscale(.7) brightness(.8)}
.mc.back .in{background:repeating-linear-gradient(45deg,#101a3a 0 12px,#0b1230 12px 24px)}
.mc.back .in::after{color:#ffe600;font-family:var(--AN);font-weight:400;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:4px 4px 0 #000}
.mc.back{--c1:#fff;--c2:#fff}
.mine{gap:12px}
.mine button:nth-child(odd) .mc{rotate:-2deg}.mine button:nth-child(even) .mc{rotate:2deg}
.sv small{font-family:'Space Grotesk',sans-serif}.sv b{font-family:var(--AN);font-weight:400;color:#ffe600;-webkit-text-stroke:2px #000;paint-order:stroke fill}
/* scoreboard strip */
.sb{display:grid;grid-template-columns:1fr 64px 1fr;gap:0;padding:16px 14px 0;align-items:stretch}
.tm{position:relative;height:64px;border:4px solid #000;color:#000;padding:0 10px;display:flex;align-items:center}
.tm.me{background:#00e5ff;justify-content:flex-end}.tm.cpu{background:#ff2bb0;justify-content:flex-start}
.tm small{position:absolute;top:2px;left:6px;font-size:9px;letter-spacing:.12em;font-weight:700;opacity:1;color:#000!important}
.tm.cpu small{left:auto;right:6px}
.tm b{font-family:var(--AN);font-weight:400;font-size:36px;line-height:1}
.tm span{position:absolute;bottom:2px;left:6px;font-size:11px;font-weight:700;opacity:1}
.tm.cpu span{left:auto;right:6px}
.qb{background:#000;color:#ffe600;border-radius:0;font-family:var(--AN);font-weight:400;font-size:28px;display:grid;place-items:center;padding:0;letter-spacing:.02em}
/* stage */
.ttl{font-family:var(--AN);font-weight:400;font-size:24px;letter-spacing:.05em;opacity:1;color:#fff;-webkit-text-stroke:2.5px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000;text-transform:uppercase}
.ban{background:#ffe600;color:#000;border:4px solid #000;box-shadow:5px 5px 0 #000;transform:rotate(-2deg);font-family:var(--AN);font-weight:400;font-size:26px;letter-spacing:.03em;min-height:0;padding:6px 16px;width:max-content;max-width:96%;margin:4px auto 0;text-transform:uppercase}
.ban:empty{display:none}.ban span{color:#ff2bb0!important;-webkit-text-stroke:1.5px #000;paint-order:stroke fill}
.ban small{font-family:'Space Grotesk',sans-serif;font-weight:700;opacity:1;font-size:12px;letter-spacing:.06em}
.pips{margin-bottom:8px;gap:14px}.pips i{width:20px;height:20px;border-radius:0;background:#fff;border:3px solid #000;transform:rotate(45deg);box-shadow:none}
.pips i.m{background:#ffe600;box-shadow:none}.pips i.c{background:#ff2bb0;box-shadow:none}
.pop .tx{left:0;right:0;margin:auto;width:max-content;height:max-content;top:36%;rotate:-6deg;font-family:var(--AN);font-weight:400;font-style:normal;font-size:62px;color:#fff;padding:20px 44px;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:5px 5px 0 #000;clip-path:polygon(0 8%,10% 0,22% 10%,34% 0,48% 9%,62% 0,76% 10%,90% 0,100% 8%,95% 50%,100% 92%,86% 100%,72% 90%,58% 100%,44% 91%,30% 100%,16% 90%,4% 100%,8% 50%)}
.pop .tx.g{background:#ffe600;color:#fff}.pop .tx.cg{background:#ff2bb0;color:#fff}.pop .tx.b{background:#fff;color:#000;font-size:36px;-webkit-text-stroke:0;text-shadow:none;padding:16px 40px}
.log div{background:#fff;color:#000;border:3px solid #000;border-radius:0;box-shadow:3px 3px 0 #000;font-weight:700}
.log .m b{background:#ffe600;padding:0 6px;color:#000}.log .c b{background:#ff2bb0;color:#fff;padding:0 6px}
.qs .l{background:#fff;color:#000;border:4px solid #000;border-radius:0;box-shadow:4px 4px 0 #000;font-weight:700;font-family:'Space Grotesk',sans-serif}
.qs .l b{font-family:var(--AN);font-weight:400;font-size:20px;letter-spacing:.03em}
.qs .l.m b{background:#ffe600;padding:0 8px;color:#000}.qs .l.c b{background:#ff2bb0;color:#fff;padding:0 8px}
.big{display:flex;align-items:baseline;justify-content:center;gap:10px;font-family:var(--AN);font-weight:400;line-height:1;rotate:-3deg;font-size:96px}
.big .bm{color:#ffe600}.big .bc{color:#fff}.big .bv{font-size:32px;color:#000}
.big .bm,.big .bc{-webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:6px 6px 0 #000}
/* result */
.res h2{font-family:var(--AN);font-weight:400;font-style:normal;font-size:130px;line-height:1;letter-spacing:.02em;-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:8px 8px 0 #000;rotate:-4deg}
.res .sc{font-family:var(--AN);font-weight:400;font-size:32px;color:#000;letter-spacing:.03em}.res .sc span{font-family:'Space Grotesk',sans-serif;font-weight:700;opacity:1;font-size:14px}
.pill{background:#000;color:#ffe600;border-radius:0;font-family:var(--AN);font-weight:400;font-size:18px;letter-spacing:.05em;padding:5px 14px}
/* picker sheet */
.sheet .box{background:#ffe600;border:5px solid #000;border-bottom:0;border-radius:0;box-shadow:0 -8px 0 #000}
.sheet h3{font-family:var(--AN);font-weight:400;font-size:22px;letter-spacing:.06em;opacity:1;color:#000}
.pr{background:#fff;color:#000;border:3px solid #000;border-radius:0;box-shadow:4px 4px 0 #000}
.pr b{font-family:var(--AN);font-weight:400;font-size:20px;letter-spacing:.03em}.pr small{opacity:.7;font-weight:700}.pr .o{font-family:var(--AN);font-weight:400;font-style:normal;font-size:30px}
.pr.used{opacity:.5}

.diamond{--bg:radial-gradient(70% 50% at 20% 25%,#ff2bd0,transparent 70%),radial-gradient(70% 50% at 85% 30%,#18d8ff,transparent 70%),radial-gradient(80% 50% at 50% 80%,#ffd23a,transparent 70%),#140a2a}
.top{padding-top:34px}
.mc .nm{font-size:calc(var(--w,90px)*.17)}
.ban{font-size:22px}
</style>
</head>
<body>
<div id="app">
 <section class="screen on" id="sLine">
  <div class="top"><h1>YOUR SEVEN</h1><p>1 ruck, 2 mids, 2 backs, 2 forwards. Tap a card to swap.</p></div>
  <div class="form" id="form"></div>
  <div class="bar-btns" style="grid-template-columns:110px 1fr"><button class="btn" id="auto">AUTO</button><button class="btn main" id="play">PLAY MATCH ▶</button></div>
  <div class="sheet" id="sheet"><div class="box"><h3 id="shTitle"></h3><div class="list" id="shList"></div><button class="btn" id="shClose">CANCEL</button></div></div>
 </section>
 <section class="screen" id="sMatch">
  <div class="sb">
   <div class="tm me"><small>YOUR TEAM</small><b id="sMe">0.0</b><span id="sMeT">0</span></div>
   <div class="qb" id="qb">Q1</div>
   <div class="tm cpu"><small>CHALLENGERS</small><b id="sCpu">0.0</b><span id="sCpuT">0</span></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bar-btns"><button class="btn main" id="go">CENTRE BOUNCE</button></div>
 </section>
 <section class="screen" id="sRes">
  <div class="res" id="resBody"></div>
  <div class="bar-btns"><button class="btn main" id="again">PLAY AGAIN</button><button class="btn" id="toLine">CHANGE LINE-UP</button></div>
 </section>
</div>
<script src="cards.js"></script>
<script>
(function(){
var ST=window.ST,S={};ST.forEach(function(n,i){S[n]=i});
function tierOf(o){return o>=90?"diamond":o>=85?"ruby":o>=80?"amethyst":o>=75?"sapphire":o>=70?"emerald":o>=65?"topaz":"quartz"}
var POOL=window.CARDS.map(function(p,i){var pr=p[0].split(" "),f=pr[0],l=pr.slice(1).join(" ");return{id:i,name:p[0],first:f,last:l,club:p[1],pos:p[2],o:p[3],s:p[4],t:tierOf(p[3]),img:p[5]?"assets/players/"+p[5]:"",tall:/Bontempelli/.test(p[0]),cut:/\.png$/.test(p[5])}});
var ROLES=["FWD","FWD","MID","RUC","MID","DEF","DEF"];           // slot roles
var LINEW=[1,1,.35,.35,.35,.05,.05];                              // who takes the shots
var me=[null,null,null,null,null,null,null],cpu=null;
var $=function(i){return document.getElementById(i)};
function show(id){["sLine","sMatch","sRes"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function pick3(a){a=a.slice();var o=[];for(var i=0;i<3;i++)o.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);return o}
var ABB={"Kicking":"KIK","Tackling":"TKL","Hit-out":"HIT","Contested":"CNT","Clearance":"CLR","Spoil":"SPL","Rebound":"RBD","Forward mark":"MRK","Accuracy":"ACC"};
function dv(sz,style,inner,cls){return'<div class="dv'+(cls?' '+cls:'')+'" style="width:'+sz+'px;height:'+sz+'px;'+style+'"><i>'+inner+'</i></div>'}
function card(c,w,tag,o){o=o||{};if(!c)return'<div class="mc" style="--w:'+w+'px"><div class="in"><div class="ini">+</div></div></div>';
 var big=w>=140,mid=w>=80,pic=c.img?'<div class="ph'+(c.tall?' tall':'')+(c.cut?' cut':'')+'" style="background-image:url('+c.img+')"></div>':'<div class="sil"></div><div class="sil2"></div>';
 var h='<div class="mc '+c.t+(o.cls?' '+o.cls:'')+'" style="--w:'+w+'px">'+(tag?'<div class="tag">'+tag+'</div>':'')+'<div class="in">'+pic+'<div class="sh"></div><div class="gl"></div>';
 if(!mid){h+='<div class="ov">'+c.o+'</div><div class="ps">'+c.pos+'</div>'}
 else{var os=Math.round(w*(big?.34:.4));h+=dv(os,'left:'+Math.round(w*.015)+'px;top:'+Math.round(w*.015)+'px','<b style="font-size:'+Math.round(os*.5)+'px">'+c.o+'</b>','ov');
  var ps=Math.round(w*.2);h+=dv(ps,'right:'+Math.round(w*.02)+'px;top:'+Math.round(w*.02)+'px','<b style="font-size:'+Math.round(ps*.3)+'px">'+c.pos+'</b>')}
 if(big){var st=POS[c.pos]||[],sz=Math.round(w*.215);h+='<div class="row4" style="bottom:'+Math.round(w*.19)+'px;gap:'+Math.round(w*.012)+'px">'+st.map(function(k){var on=o.act===k;
   return dv(on?Math.round(sz*1.18):sz,'position:relative',(on?'':'<small style="font-size:'+Math.max(7,Math.round(sz*.2))+'px">'+ABB[k]+'</small>')+'<b style="font-size:'+Math.round(sz*(on?.5:.36))+'px">'+c.s[S[k]]+'</b>',on?'on'+(o.c?' bl':''):'')}).join("")+'</div>'}
 else if(o.sv){h+='<div class="sv'+(o.c?' c':'')+'" style="z-index:4"><small>'+o.sv[0]+'</small><b>'+o.sv[1]+'</b></div>'}
 return h+'<div class="nm">'+c.last+'</div></div></div>'}
/* ---------- auto pick ---------- */
function autoPick(avail,order){var out=[null,null,null,null,null,null,null],left=avail.slice();
 function take(slot,pos){var best=null;left.forEach(function(c){if(pos&&c.pos!==pos)return;if(!best||c.o>best.o)best=c});
  if(!best)left.forEach(function(c){if(!best||c.o>best.o)best=c});
  if(best){out[slot]=best;left.splice(left.indexOf(best),1)}}
 [[3,"RUC"],[5,"DEF"],[6,"DEF"],[0,"FWD"],[1,"FWD"],[2,"MID"],[4,"MID"]].forEach(function(x){take(x[0],x[1])});return out}
/* ---------- lineup screen ---------- */
var editing=-1;
function drawLine(){var rows=[["FORWARDS",[0,1]],["MIDFIELD  ·  CENTRE = RUCK",[2,3,4]],["BACKS",[5,6]]];
 $("form").innerHTML=rows.map(function(r){return'<div><div class="cap">'+r[0]+'</div><div class="rowc">'+r[1].map(function(i){
  return'<button class="slot" data-i="'+i+'">'+card(me[i],i===3?126:114,i===3?"RUCK":"")+'</button>'}).join("")+'</div></div>'}).join("");
 [].forEach.call($("form").querySelectorAll(".slot"),function(b){b.onclick=function(){openSheet(+b.dataset.i)}})}
function openSheet(i){editing=i;$("shTitle").textContent="PICK "+ROLES[i]+" · TAP TO PLACE";
 $("shList").innerHTML=POOL.map(function(c){var used=me.indexOf(c);return'<button class="pr'+(used>=0&&used!==i?' used':'')+'" data-id="'+c.id+'">'+card(c,46)+'<div class="t"><b>'+c.name+'</b><small>'+c.pos+(used>=0?' · IN LINE-UP':'')+'</small></div><div class="o">'+c.o+'</div></button>'}).join("");
 [].forEach.call($("shList").querySelectorAll(".pr"),function(b){b.onclick=function(){var c=POOL[+b.dataset.id],u=me.indexOf(c);if(u>=0)me[u]=me[editing];me[editing]=c;closeSheet();drawLine()}});
 $("sheet").classList.add("on")}
function closeSheet(){$("sheet").classList.remove("on")}
$("shClose").onclick=closeSheet;$("sheet").onclick=function(e){if(e.target===$("sheet"))closeSheet()};
$("auto").onclick=function(){me=autoPick(POOL);drawLine()};

/* ---------- match engine ---------- */
var POS={RUC:["Kicking","Tackling","Hit-out","Contested"],MID:["Kicking","Tackling","Clearance","Contested"],DEF:["Kicking","Tackling","Spoil","Rebound"],FWD:["Kicking","Tackling","Forward mark","Accuracy"]};
var LINES=[{pos:"RUC",name:"RUCK",slots:[3]},{pos:"MID",name:"MIDFIELD",slots:[2,4]},{pos:"DEF",name:"DEFENCE",slots:[5,6]},{pos:"FWD",name:"FORWARD LINE",slots:[0,1]}];
var QT=["QUARTER TIME","HALF TIME","THREE QUARTER TIME","FULL TIME"];
var SHORT={"Forward mark":"Mark","Hit-out":"Hit-out"};
function nx(a,b){return Math.max(-1,Math.min(1,(a-b)/(a+b)*4))}
function gauss(){var u=1-Math.random(),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function gamma4(th){var s=0;for(var i=0;i<4;i++)s+=-Math.log(1-Math.random());return s*th}
function poisson(l){var L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function sv(c,k){return c.s[S[k]]}
function pts(t){return t.g*6+t.b}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var G,tok=0;
function newGame(){tok++;G={q:0,me:{g:0,b:0},cpu:{g:0,b:0},scorers:{me:{},cpu:{}},phase:"",Q:{}}}
function later(ms,fn){var t=tok;setTimeout(function(){if(t===tok)fn()},ms)}
function scoreboard(){$("sMe").textContent=G.me.g+"."+G.me.b;$("sMeT").textContent=pts(G.me);$("sCpu").textContent=G.cpu.g+"."+G.cpu.b;$("sCpuT").textContent=pts(G.cpu);$("qb").textContent=G.done?"FT":(G.q?"Q"+G.q:"START")}
function buttons(label){var b=$("go"),bar=b.parentNode;if(label===null){bar.classList.add("hide");return}bar.classList.remove("hide");b.textContent=label;b.disabled=false}
function banner(h,s){var e=$("ban");if(e)e.innerHTML=h+(s?'<small>'+s+'</small>':"")}
function pips(r,n){var a=r.slice();while(a.length<n)a.push("");$("pips").innerHTML=a.map(function(x){return'<i class="'+(x||"")+'"></i>'}).join("")}
function apply(e,qo){var t=G[e.side],s=G.scorers[e.side];if(e.goal){t.g++;qo[e.side].g++}else{t.b++;qo[e.side].b++}
 var o=s[e.c.last]||(s[e.c.last]={g:0,b:0,c:e.c});if(e.goal)o.g++;else o.b++;scoreboard()}
function cpuPick(opts,k){var best=opts.slice().sort(function(a,b){return sv(b,k)-sv(a,k)})[0];return Math.random()<.72?best:opts[Math.floor(Math.random()*opts.length)]}
function lineOf(team,ln){return ln.slots.map(function(i){return team[i]})}
function shoot(team,gap,side){var mean=Math.max(.8,5.6*(1+.5*gap))*Math.exp(gauss()*.3),n=poisson(gamma4(mean/4)),ev=[];
 var w=team.map(function(c,i){return Math.pow(c.s[S["Scoring"]],2)*LINEW[i]}),tot=w.reduce(function(a,b){return a+b},0);
 for(var k=0;k<n;k++){var r=Math.random()*tot,i=0;while(i<6&&r>w[i]){r-=w[i];i++}
  var p=Math.max(.15,Math.min(.8,.32+.30*(team[i].s[S["Accuracy"]]-35)/64+gauss()*.07));ev.push({side:side,c:team[i],goal:Math.random()<p})}
 return ev}
function frame(){$("stage").innerHTML='<div class="ttl" id="ttl"></div><div class="opp" id="opp"></div><div><div class="pips" id="pips"></div><div class="ban" id="ban"></div></div><div class="mine" id="mine"></div>'}
/* ---------- start ---------- */
function startMatch(){if(me.filter(Boolean).length<7)me=autoPick(POOL);
 cpu=autoPick(POOL.filter(function(c){return me.indexOf(c)<0}));newGame();scoreboard();show("sMatch");
 $("stage").innerHTML='<div class="ttl">FOUR QUARTERS</div><div class="qs" style="width:100%">'+LINES.map(function(l,i){return'<div class="l"><span>Q'+(i+1)+'</span><b>'+l.name+'</b></div>'}).join("")+'</div><div class="ban">Each quarter: 2 random stats, you pick the card<small>Bigger wins mean a bigger quarter score</small></div><div></div>';
 G.phase="start";buttons("FIRST BOUNCE ▶")}
/* ---------- one quarter ---------- */
function startQuarter(){G.q++;var ln=LINES[G.q-1];G.Q={ln:ln,stats:shuf(POS[ln.pos]).slice(0,2),res:[],my:lineOf(me,ln),cp:lineOf(cpu,ln)};scoreboard();frame();buttons(null);round(0)}
function round(r){var Q=G.Q;if(r>=2)return quarterDone();var k=Q.stats[r],n=Q.my.length,w=n===1?170:150,ln=Q.ln;
 $("ttl").textContent="QUARTER "+G.q+" · "+ln.name;pips(Q.res.map(function(x){return x.w}),2);
 banner((n===1?"PLAY YOUR RUCK FOR ":"PICK A "+ln.pos+" FOR ")+'<span style="color:var(--gold)">'+(SHORT[k]||k).toUpperCase()+'</span>',"Round "+(r+1)+" of 2");
 $("opp").innerHTML=card(Q.cp[0],176,"",{cls:"back"});
 $("mine").innerHTML=Q.my.map(function(c,i){return'<button data-i="'+i+'">'+card(c,w,"",{act:k,sv:[SHORT[k]||k,sv(c,k)]})+'</button>'}).join("");
 [].forEach.call($("mine").querySelectorAll("button"),function(b){b.onclick=function(){
  var c=Q.my[+b.dataset.i];[].forEach.call($("mine").querySelectorAll("button"),function(x){x.classList.add("lock")});
  var oc=cpuPick(Q.cp,k),mv=sv(c,k),ov=sv(oc,k),win=mv>ov?"m":mv<ov?"c":(Math.random()<.5?"m":"c");
  $("opp").innerHTML=card(oc,176,"",{act:k,sv:[SHORT[k]||k,ov],c:true,cls:"flip"+(win==="c"?" cwin":"")});
  b.querySelector(".mc").classList.add(win==="m"?"win":"lose");
  [].forEach.call($("mine").querySelectorAll("button"),function(x){if(x!==b)x.style.opacity=".35"});
  Q.res.push({w:win,x:nx(mv,ov)});pips(Q.res.map(function(x){return x.w}),2);
  banner(win==="m"?"YOU WIN IT":"THEY WIN IT",mv+"  v  "+ov);later(1500,function(){round(r+1)})}})}
function quarterDone(){var Q=G.Q,wins=Q.res.filter(function(x){return x.w==="m"}).length,x=(Q.res[0].x+Q.res[1].x)/2;
 var g=Math.max(-1,Math.min(1,x*1.3));
 if(G.q===4){var m=pts(G.me)-pts(G.cpu);if(m<-30)g+=.25;else if(m>30)g-=.15}
 var win=wins>1?"me":wins<1?"cpu":(x>0?"me":x<0?"cpu":(Math.random()<.5?"me":"cpu")),upset=Math.random()<.12,tries=0,ev,qo;
 do{ev=shoot(me,g,"me").concat(shoot(cpu,-g,"cpu"));qo={me:{g:0,b:0},cpu:{g:0,b:0}};ev.forEach(function(e){var t=qo[e.side];if(e.goal)t.g++;else t.b++});tries++}
 while(!upset&&tries<60&&(win==="me"?pts(qo.me)<=pts(qo.cpu):pts(qo.cpu)<=pts(qo.me)));
 Q.ev=shuf(ev);Q.qo={me:{g:0,b:0},cpu:{g:0,b:0}};Q.i=0;scoring()}
function scoring(){var Q=G.Q;$("stage").innerHTML='<div class="ttl">'+QT[G.q-1]+'</div><div class="pop" id="pop"></div><div class="log" id="log"></div><div></div>';buttons("SKIP ▶");G.phase="skip";tick()}
function tick(){var Q=G.Q;if(G.phase!=="skip")return;if(Q.i>=Q.ev.length){return summary()}
 var e=Q.ev[Q.i++];apply(e,Q.qo);var m=e.side==="me";
 $("pop").innerHTML=card(e.c,170,"",{cls:"flip"})+'<div class="tx '+(e.goal?(m?"g":"cg"):"b")+'">'+(e.goal?"GOAL!":"BEHIND")+'</div>';
 var l=document.createElement("div");l.className=m?"m":"c";l.innerHTML='<span>'+e.c.last+(e.goal?' goal':' behind')+'</span><b>'+pts(G.me)+' – '+pts(G.cpu)+'</b>';var lg=$("log");lg.insertBefore(l,lg.firstChild);while(lg.children.length>3)lg.removeChild(lg.lastChild);
 later(560,tick)}
function summary(){var Q=G.Q;G.phase="next";var last=G.q>=4,a=pts(G.me),b=pts(G.cpu);
 $("stage").innerHTML='<div class="ttl">'+QT[G.q-1]+'</div><div class="big"><span class="bm">'+Q.qo.me.g+'.'+Q.qo.me.b+'</span><span class="bv">v</span><span class="bc">'+Q.qo.cpu.g+'.'+Q.qo.cpu.b+'</span></div><div class="ttl">THIS QUARTER</div><div class="qs"><div class="l m"><span>YOUR TEAM</span><b>'+G.me.g+'.'+G.me.b+' ('+a+')</b></div><div class="l c"><span>CHALLENGERS</span><b>'+G.cpu.g+'.'+G.cpu.b+' ('+b+')</b></div></div><div class="ttl">'+(a>b?"YOU LEAD BY "+(a-b):a<b?"YOU TRAIL BY "+(b-a):"ALL SQUARE")+'</div><div></div>';
 buttons(last?"FULL TIME ▶":"QUARTER "+(G.q+1)+" · "+LINES[G.q].name+" ▶")}
$("go").onclick=function(){var p=G.phase;
 if(p==="start"||p==="next"){if(p==="next"&&G.q>=4){G.done=true;scoreboard();finish()}else{G.phase="";startQuarter()}}
 else if(p==="skip"){var Q=G.Q;G.phase="";while(Q.i<Q.ev.length)apply(Q.ev[Q.i++],Q.qo);summary()}};
$("play").onclick=startMatch;
function finish(){var a=pts(G.me),b=pts(G.cpu),res=a>b?"WIN":a<b?"LOSS":"DRAW",st=0;
 try{st=+localStorage.getItem("afl_streak")||0;st=res==="WIN"?st+1:res==="LOSS"?0:st;localStorage.setItem("afl_streak",st)}catch(e){}
 var all=Object.keys(G.scorers.me).map(function(n){return G.scorers.me[n]});all.sort(function(x,y){return y.g*6+y.b-(x.g*6+x.b)});
 $("resBody").innerHTML='<h2 style="color:'+(res==="WIN"?"var(--gold)":res==="LOSS"?"#ff6b6b":"#fff")+'">'+res+'</h2><div class="sc">'+G.me.g+'.'+G.me.b+' ('+a+') &nbsp;v&nbsp; '+G.cpu.g+'.'+G.cpu.b+' ('+b+')<span>'+(a===b?"Dead heat":"Margin "+Math.abs(a-b)+" points")+'</span></div>'
  +'<div class="tops">'+all.slice(0,3).map(function(o){return'<div style="text-align:center">'+card(o.c,106)+'<div class="pill" style="margin-top:8px">'+o.g+'.'+o.b+'</div></div>'}).join("")+'</div><div class="pill">WIN STREAK '+st+'</div>';
