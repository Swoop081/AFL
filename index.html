<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>AFL SuperCard</title>
<style>
:root{--gold:#FFD200;--blue:#4aa3ff;--bg:#07090d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
#app{height:100dvh;position:relative;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
 background:radial-gradient(90% 50% at 50% 0%,rgba(255,210,0,.14),transparent 70%),radial-gradient(120% 70% at 50% 120%,#14110a,#07090d 60%)}
.screen{position:absolute;inset:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;display:none;flex-direction:column}
.screen.on{display:flex}
h1,h2,h3,p{margin:0}
.top{padding:14px 18px 6px;text-align:center}
.top h1{font-size:13px;letter-spacing:.22em;text-transform:uppercase;opacity:.7;font-weight:800}
.top p{font-size:12px;opacity:.5;margin-top:3px}
.bar-btns{display:grid;gap:10px;padding:8px 16px 16px}
.btn{height:62px;border:0;border-radius:20px;font-size:18px;font-weight:900;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.13);transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.main{background:linear-gradient(180deg,#ffe24d,#e6b800);color:#201800;box-shadow:0 8px 24px rgba(255,200,0,.28)}
.btn[disabled]{opacity:.35}
/* cards */
.mc{--c1:#e5ebf0;--c2:#4b5560;position:relative;width:var(--w,90px);aspect-ratio:3/4;border-radius:13px;padding:3px;background:linear-gradient(145deg,var(--c1),var(--c2) 55%,var(--c1));box-shadow:0 8px 18px rgba(0,0,0,.5),0 0 14px var(--gl,transparent);flex:none}
.mc .in{position:relative;height:100%;border-radius:10px;overflow:hidden;background:radial-gradient(80% 60% at 70% 30%,rgba(255,210,0,.18),transparent),#0b0b0d}
.mc .ph{position:absolute;inset:0;background-size:cover;background-position:50% 22%}
.mc .ph.tall{background-size:150%;background-position:50% 8%}
.mc .ini{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:calc(var(--w,90px)*.34);opacity:.35}
.mc .sh{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 35%,transparent 58%,rgba(0,0,0,.92))}
.mc .ov{position:absolute;left:5px;top:1px;font-weight:900;font-style:italic;font-size:calc(var(--w,90px)*.32);line-height:1;color:#fff;text-shadow:0 2px 5px #000;letter-spacing:-.02em}
.mc .ps{position:absolute;left:6px;top:calc(var(--w,90px)*.32 + 3px);font-size:calc(var(--w,90px)*.11);font-weight:800;letter-spacing:.1em;opacity:.9;text-shadow:0 1px 3px #000}
.mc .nm{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-weight:900;font-style:italic;text-transform:uppercase;font-size:calc(var(--w,90px)*.14);letter-spacing:.02em;text-shadow:0 2px 4px #000;white-space:nowrap;overflow:hidden;padding:0 2px}
.diamond{--c1:#e4faff;--c2:#2a7fb0;--gl:rgba(90,205,255,.4)}.ruby{--c1:#ff8d9b;--c2:#7e0f22;--gl:rgba(224,38,63,.4)}
.amethyst{--c1:#e6c2ff;--c2:#5d2aa6;--gl:rgba(168,85,247,.4)}.sapphire{--c1:#9db9ff;--c2:#1b3f9e;--gl:rgba(47,109,240,.4)}
.emerald{--c1:#8ff0bb;--c2:#0c6b3c;--gl:rgba(31,184,106,.35)}.topaz{--c1:#ffd27a;--c2:#9a5b00;--gl:rgba(242,165,22,.35)}
.quartz{--c1:#e5ebf0;--c2:#4b5560}
/* lineup */
.form{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 10px}
.cap{text-align:center;font-size:11px;letter-spacing:.2em;opacity:.55;font-weight:800;margin-bottom:6px}
.rowc{display:flex;justify-content:center;gap:12px}
.slot{background:none;border:0;padding:0;color:inherit}
.slot.empty .mc{opacity:.35}
.slot .tag{position:absolute;right:-4px;top:-6px;background:var(--gold);color:#111;font-size:9px;font-weight:900;border-radius:6px;padding:2px 5px;z-index:2}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet .box{width:100%;max-height:78%;display:flex;flex-direction:column;background:#12141a;border-radius:24px 24px 0 0;padding:14px 14px 14px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sheet h3{text-align:center;font-size:13px;letter-spacing:.18em;opacity:.7;margin-bottom:10px}
.list{overflow:auto;flex:1;display:grid;gap:8px;padding-bottom:10px}
.pr{display:flex;align-items:center;gap:12px;border:0;color:#fff;text-align:left;background:rgba(255,255,255,.07);border-radius:14px;padding:6px 12px 6px 6px;width:100%}
.pr .t{flex:1}.pr b{display:block;font-size:16px}.pr small{opacity:.55;font-size:11px;letter-spacing:.1em}
.pr .o{font-size:26px;font-weight:900;font-style:italic}
.pr.used{opacity:.55}
/* match */
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px 2px;gap:6px}
.tm{text-align:center}.tm small{display:block;font-size:10px;letter-spacing:.2em;font-weight:900;opacity:.8}
.tm b{display:block;font-size:28px;font-weight:900;line-height:1.1}.tm span{font-size:12px;opacity:.6}
.tm.me small{color:var(--gold)}.tm.cpu small{color:var(--blue)}
.qb{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;font-weight:900;letter-spacing:.1em;font-size:14px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 10px 10px}
.ttl{text-align:center;font-size:12px;font-weight:900;letter-spacing:.18em;opacity:.8;min-height:16px}
.opp{display:grid;place-items:center;min-height:0}
.mine{display:flex;justify-content:center;gap:10px;width:100%}
.mine button{background:none;border:0;padding:0;color:inherit;transition:transform .15s,opacity .2s}
.mine button:active{transform:scale(.95)}
.mine button.used{opacity:.3;pointer-events:none;filter:grayscale(1)}
.mine button.lock{pointer-events:none}
.mc.win{box-shadow:0 0 0 3px var(--gold),0 0 30px rgba(255,210,0,.7);transform:translateY(-6px) scale(1.04)}
.mc.lose{opacity:.55;filter:grayscale(.6)}
.mc.cwin{box-shadow:0 0 0 3px var(--blue),0 0 30px rgba(74,163,255,.7);transform:translateY(-6px) scale(1.04)}
.mc{transition:transform .3s,box-shadow .3s,opacity .3s}
.mc.back .in{background:repeating-linear-gradient(45deg,#14161d 0 6px,#1b1e27 6px 12px)}
.mc.back .in::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w,90px)*.5);font-weight:900;color:var(--blue);opacity:.8}
.mc.back{--c1:#8ec5ff;--c2:#1b4f8f}
.mc.back .in>*{visibility:hidden}
.mc.flip{animation:flip .55s ease-out}
@keyframes flip{0%{transform:rotateY(90deg) scale(.9)}100%{transform:none}}
.sv{position:absolute;left:0;right:0;bottom:calc(var(--w,90px)*.2);text-align:center;line-height:1;text-shadow:0 2px 6px #000}
.sv small{display:block;font-size:calc(var(--w,90px)*.085);font-weight:900;letter-spacing:.12em;opacity:.9;text-transform:uppercase}
.sv b{display:block;font-size:calc(var(--w,90px)*.34);font-weight:900;color:var(--gold)}
.sv.c b{color:var(--blue)}
.pips{display:flex;gap:8px;justify-content:center}
.pips i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18)}
.pips i.m{background:var(--gold);box-shadow:0 0 10px var(--gold)}.pips i.c{background:var(--blue);box-shadow:0 0 10px var(--blue)}
.ban{text-align:center;font-size:20px;font-weight:900;min-height:50px;display:grid;place-items:center;line-height:1.15;padding:0 8px}
.ban small{display:block;font-size:12px;opacity:.65;font-weight:700;margin-top:3px}
.pop{position:relative;display:grid;place-items:center;min-height:0}
.pop .tx{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:44px;font-weight:900;font-style:italic;text-shadow:0 4px 14px #000;animation:boom .5s ease-out}
.pop .tx.g{color:var(--gold)}.pop .tx.b{color:#cfd6df;font-size:30px}.pop .tx.cg{color:var(--blue)}
@keyframes boom{0%{transform:scale(2.2);opacity:0}100%{transform:none;opacity:1}}
.log{display:grid;gap:5px;width:100%;font-size:13px;font-weight:700}
.log div{display:flex;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:10px;padding:6px 10px}
.log .m b{color:var(--gold)}.log .c b{color:var(--blue)}
.qs{display:grid;gap:8px;width:100%}
.qs .l{display:flex;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;font-size:15px}
.qs .l.m b{color:var(--gold)}.qs .l.c b{color:var(--blue)}
.big{font-size:44px;font-weight:900;text-align:center;line-height:1}
/* result */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 20px;text-align:center}
.res h2{font-size:56px;font-weight:900;font-style:italic;letter-spacing:.02em}
.res .sc{font-size:22px;font-weight:800}.res .sc span{opacity:.5;font-size:14px;display:block;margin-top:2px}
.pill{background:rgba(255,255,255,.1);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:800;letter-spacing:.05em}
.tops{display:flex;gap:8px;justify-content:center}
.hide{display:none!important}
.sq{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:6px 8px}
.sqh{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;font-weight:900;margin-bottom:5px}.sqh b{color:var(--gold)}
.sqc{display:flex;gap:6px;justify-content:center}.pc,.hand button{background:none;border:0;padding:0;color:inherit}
.slot0{width:84px;aspect-ratio:3/4;border:2px dashed rgba(255,255,255,.22);border-radius:12px}
.hand{display:flex;gap:4px;justify-content:center;width:100%}
.hc.sel .mc{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold);transform:translateY(-8px)}
.rv{display:flex;gap:8px;justify-content:center}
.zone{position:absolute;top:0;bottom:0;background:rgba(255,210,0,.4);border:2px solid var(--gold);border-radius:12px}
.meter{position:relative;height:34px;width:92%;margin:8px auto 0;border-radius:17px;background:linear-gradient(90deg,#4a1f1f,#4a4a1f,#1f4a2b);border:2px solid rgba(255,255,255,.2)}
.meter i{position:absolute;top:-6px;bottom:-6px;width:8px;border-radius:4px;background:var(--gold);box-shadow:0 0 12px var(--gold);left:0;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">
 <section class="screen on" id="sLine">
  <div class="top"><h1>Set your 7</h1><p>1 ruck, 2 mids, 2 backs, 2 forwards. Tap a card to swap.</p></div>
  <div class="form" id="form"></div>
  <div class="bar-btns" style="grid-template-columns:110px 1fr"><button class="btn" id="auto">AUTO</button><button class="btn main" id="play">PLAY MATCH ▶</button></div>
  <div class="sheet" id="sheet"><div class="box"><h3 id="shTitle"></h3><div class="list" id="shList"></div><button class="btn" id="shClose">CANCEL</button></div></div>
 </section>
 <section class="screen" id="sMatch">
  <div class="sb">
   <div class="tm me"><small>YOUR TEAM</small><b id="sMe">0.0</b><span id="sMeT">0</span></div>
   <div class="qb" id="qb">Q1</div>
   <div class="tm cpu"><small>CHALLENGERS</small><b id="sCpu">0.0</b><span id="sCpuT">0</span></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bar-btns"><button class="btn main" id="go">CENTRE BOUNCE</button></div>
 </section>
 <section class="screen" id="sRes">
  <div class="res" id="resBody"></div>
  <div class="bar-btns"><button class="btn main" id="again">PLAY AGAIN</button><button class="btn" id="toLine">CHANGE LINE-UP</button></div>
 </section>
</div>
<script src="cards.js"></script>
<script>
(function(){
var ST=window.ST,S={};ST.forEach(function(n,i){S[n]=i});
function tierOf(o){return o>=90?"diamond":o>=85?"ruby":o>=80?"amethyst":o>=75?"sapphire":o>=70?"emerald":o>=65?"topaz":"quartz"}
var POOL=window.CARDS.map(function(p,i){var pr=p[0].split(" "),f=pr[0],l=pr.slice(1).join(" ");return{id:i,name:p[0],first:f,last:l,club:p[1],pos:p[2],o:p[3],s:p[4],t:tierOf(p[3]),img:p[5]?"assets/players/"+p[5]:"",tall:/Bontempelli/.test(p[0])}});
var ROLES=["FWD","FWD","MID","RUC","MID","DEF","DEF"];           // slot roles
var LINEW=[1,1,.35,.35,.35,.05,.05];                              // who takes the shots
var me=[null,null,null,null,null,null,null],cpu=null;
var $=function(i){return document.getElementById(i)};
function show(id){["sLine","sMatch","sRes"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function pick3(a){a=a.slice();var o=[];for(var i=0;i<3;i++)o.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);return o}
function card(c,w,tag,o){o=o||{};if(!c)return'<div class="mc" style="--w:'+w+'px"><div class="in"><div class="ini">+</div></div></div>';
 return'<div class="mc '+c.t+(o.cls?' '+o.cls:'')+'" style="--w:'+w+'px">'+(o.sv?'<div class="sv'+(o.c?' c':'')+'"><small>'+o.sv[0]+'</small><b>'+o.sv[1]+'</b></div>':'')+(tag?'<div class="tag">'+tag+'</div>':'')+'<div class="in"><div class="ini">'+c.first[0]+c.last[0]+'</div><div class="ph'+(c.tall?' tall':'')+'"'+(c.img?' style="background-image:url('+c.img+')"':'')+'></div><div class="sh"></div><div class="ov">'+c.o+'</div><div class="ps">'+c.pos+'</div><div class="nm">'+c.last+'</div></div></div>'}
/* ---------- auto pick ---------- */
function autoPick(avail,order){var out=[null,null,null,null,null,null,null],left=avail.slice();
 function take(slot,pos){var best=null;left.forEach(function(c){if(pos&&c.pos!==pos)return;if(!best||c.o>best.o)best=c});
  if(!best)left.forEach(function(c){if(!best||c.o>best.o)best=c});
  if(best){out[slot]=best;left.splice(left.indexOf(best),1)}}
 [[3,"RUC"],[5,"DEF"],[6,"DEF"],[0,"FWD"],[1,"FWD"],[2,"MID"],[4,"MID"]].forEach(function(x){take(x[0],x[1])});return out}
/* ---------- lineup screen ---------- */
var editing=-1;
function drawLine(){var rows=[["FORWARDS",[0,1]],["MIDFIELD  ·  CENTRE = RUCK",[2,3,4]],["BACKS",[5,6]]];
 $("form").innerHTML=rows.map(function(r){return'<div><div class="cap">'+r[0]+'</div><div class="rowc">'+r[1].map(function(i){
  return'<button class="slot" data-i="'+i+'">'+card(me[i],i===3?126:114,i===3?"RUCK":"")+'</button>'}).join("")+'</div></div>'}).join("");
 [].forEach.call($("form").querySelectorAll(".slot"),function(b){b.onclick=function(){openSheet(+b.dataset.i)}})}
function openSheet(i){editing=i;$("shTitle").textContent="PICK "+ROLES[i]+" · TAP TO PLACE";
 $("shList").innerHTML=POOL.map(function(c){var used=me.indexOf(c);return'<button class="pr'+(used>=0&&used!==i?' used':'')+'" data-id="'+c.id+'">'+card(c,46)+'<div class="t"><b>'+c.name+'</b><small>'+c.pos+(used>=0?' · IN LINE-UP':'')+'</small></div><div class="o">'+c.o+'</div></button>'}).join("");
 [].forEach.call($("shList").querySelectorAll(".pr"),function(b){b.onclick=function(){var c=POOL[+b.dataset.id],u=me.indexOf(c);if(u>=0)me[u]=me[editing];me[editing]=c;closeSheet();drawLine()}});
 $("sheet").classList.add("on")}
function closeSheet(){$("sheet").classList.remove("on")}
$("shClose").onclick=closeSheet;$("sheet").onclick=function(e){if(e.target===$("sheet"))closeSheet()};
$("auto").onclick=function(){me=autoPick(POOL);drawLine()};

/* ---------- match engine ---------- */
var POS={RUC:["Kicking","Tackling","Hit-out","Contested"],MID:["Kicking","Tackling","Clearance","Contested"],DEF:["Kicking","Tackling","Spoil","Rebound"],FWD:["Kicking","Tackling","Forward mark","Accuracy"]};
var LINES=[{pos:"RUC",name:"RUCK",slots:[3]},{pos:"MID",name:"MIDFIELD",slots:[2,4]},{pos:"DEF",name:"DEFENCE",slots:[5,6]},{pos:"FWD",name:"FORWARD LINE",slots:[0,1]}];
var QT=["QUARTER TIME","HALF TIME","THREE QUARTER TIME","FULL TIME"];
var SHORT={"Forward mark":"Mark","Hit-out":"Hit-out"};
function nx(a,b){return Math.max(-1,Math.min(1,(a-b)/(a+b)*4))}
function gauss(){var u=1-Math.random(),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function gamma4(th){var s=0;for(var i=0;i<4;i++)s+=-Math.log(1-Math.random());return s*th}
function poisson(l){var L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function sv(c,k){return c.s[S[k]]}
function pts(t){return t.g*6+t.b}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var G,tok=0;
function newGame(){tok++;G={q:0,me:{g:0,b:0},cpu:{g:0,b:0},scorers:{me:{},cpu:{}},phase:"",Q:{}}}
function later(ms,fn){var t=tok;setTimeout(function(){if(t===tok)fn()},ms)}
function scoreboard(){$("sMe").textContent=G.me.g+"."+G.me.b;$("sMeT").textContent=pts(G.me);$("sCpu").textContent=G.cpu.g+"."+G.cpu.b;$("sCpuT").textContent=pts(G.cpu);$("qb").textContent=G.done?"FT":(G.q?"Q"+G.q:"START")}
function buttons(label){var b=$("go"),bar=b.parentNode;if(label===null){bar.classList.add("hide");return}bar.classList.remove("hide");b.textContent=label;b.disabled=false}
function banner(h,s){var e=$("ban");if(e)e.innerHTML=h+(s?'<small>'+s+'</small>':"")}
function pips(r,n){var a=r.slice();while(a.length<n)a.push("");$("pips").innerHTML=a.map(function(x){return'<i class="'+(x||"")+'"></i>'}).join("")}
function apply(e,qo){var t=G[e.side],s=G.scorers[e.side];if(e.goal){t.g++;qo[e.side].g++}else{t.b++;qo[e.side].b++}
 var o=s[e.c.last]||(s[e.c.last]={g:0,b:0,c:e.c});if(e.goal)o.g++;else o.b++;scoreboard()}
function cpuPick(opts,k){var best=opts.slice().sort(function(a,b){return sv(b,k)-sv(a,k)})[0];return Math.random()<.72?best:opts[Math.floor(Math.random()*opts.length)]}
function lineOf(team,ln){return ln.slots.map(function(i){return team[i]})}
function shoot(team,gap,side){var mean=Math.max(.8,6.2*(1+.8*gap))*Math.exp(gauss()*.3),n=poisson(gamma4(mean/4)),ev=[];
 var w=team.map(function(c,i){return Math.pow(c.s[S["Scoring"]],2)*LINEW[i]}),tot=w.reduce(function(a,b){return a+b},0);
 for(var k=0;k<n;k++){var r=Math.random()*tot,i=0;while(i<6&&r>w[i]){r-=w[i];i++}
  var p=Math.max(.15,Math.min(.8,.32+.30*(team[i].s[S["Accuracy"]]-35)/64+gauss()*.07));ev.push({side:side,c:team[i],goal:Math.random()<p})}
 return ev}
function frame(){$("stage").innerHTML='<div class="ttl" id="ttl"></div><div class="opp" id="opp"></div><div><div class="pips" id="pips"></div><div class="ban" id="ban"></div></div><div class="mine" id="mine"></div>'}
/* ---------- start ---------- */
function startMatch(){if(me.filter(Boolean).length<7)me=autoPick(POOL);
 cpu=autoPick(POOL.filter(function(c){return me.indexOf(c)<0}));newGame();scoreboard();show("sMatch");
 $("stage").innerHTML='<div class="ttl">FOUR QUARTERS</div><div class="qs" style="width:100%">'+LINES.map(function(l,i){return'<div class="l"><span>Q'+(i+1)+'</span><b>'+l.name+'</b></div>'}).join("")+'</div><div class="ban">Each quarter: 2 random stats, you pick the card<small>Bigger wins mean a bigger quarter score</small></div><div></div>';
 G.phase="start";buttons("FIRST BOUNCE ▶")}
/* ---------- one quarter ---------- */
function startQuarter(){G.q++;var ln=LINES[G.q-1];G.Q={ln:ln,stats:shuf(POS[ln.pos]).slice(0,2),res:[],my:lineOf(me,ln),cp:lineOf(cpu,ln)};scoreboard();frame();buttons(null);round(0)}
function round(r){var Q=G.Q;if(r>=2)return quarterDone();var k=Q.stats[r],n=Q.my.length,w=n===1?170:150,ln=Q.ln;
 $("ttl").textContent="QUARTER "+G.q+" · "+ln.name;pips(Q.res.map(function(x){return x.w}),2);
 banner((n===1?"PLAY YOUR RUCK FOR ":"PICK A "+ln.pos+" FOR ")+'<span style="color:var(--gold)">'+(SHORT[k]||k).toUpperCase()+'</span>',"Round "+(r+1)+" of 2");
