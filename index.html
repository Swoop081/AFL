<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>AFL SuperCard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd24d;--red:#ff4f6d;--cy:#35e0ff;--pk:#ff4fd8;--bg:#05070f;--hf:'Teko','Arial Narrow',Impact,sans-serif;--bf:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--pan:rgba(255,255,255,.07);--pb:1px solid rgba(255,255,255,.16);--sub:#8fa0cc;--cw:86px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:var(--bf);touch-action:manipulation}
#app{height:100dvh;position:relative;background:radial-gradient(120% 55% at 50% -8%,#1b3a8a 0,#0a1330 45%,#05070f 100%)}
.screen{position:absolute;inset:env(safe-area-inset-top) 0 0 0;display:none;flex-direction:column;padding-bottom:0}
.screen.on{display:flex}
.screen.hn{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
button{font-family:inherit;color:inherit}
.hide{display:none!important}
.tb{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px;min-height:52px}
.tb h1{font-family:var(--hf);font-weight:700;font-size:30px;letter-spacing:.06em;line-height:1}
.pills{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 8px;border-radius:15px;background:var(--pan);border:var(--pb);font-weight:700;font-size:13px;white-space:nowrap}
.pill i{width:14px;height:14px;background:var(--gold);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.pill.pkp i{background:var(--pk)}
.panel{background:var(--pan);border:var(--pb);border-radius:16px}
.btn{height:56px;border:0;border-radius:28px;font-family:var(--hf);font-weight:700;font-size:25px;letter-spacing:.1em;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.main{background:linear-gradient(180deg,#ffe27a,#f0b800);color:#2a1a00;border:0;box-shadow:0 6px 18px rgba(255,200,0,.3)}
.btn[disabled]{opacity:.4;pointer-events:none}
.bar{display:grid;gap:10px;padding:8px 16px 14px}
.row2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.bar{min-width:0;box-sizing:border-box;width:100%}.bar .btn{font-size:21px;padding:0 8px}
#nav{position:absolute;left:0;right:0;bottom:0;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:center;background:rgba(5,8,18,.94);border-top:1px solid rgba(255,255,255,.14);z-index:15}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8fa0cc;font-size:10px;font-weight:800;letter-spacing:.14em;padding:6px 14px;position:relative}
#nav button i{width:22px;height:22px;background:currentColor;opacity:.55;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
#nav button.on{color:var(--gold)}#nav button.on i{opacity:1}
#nav b{position:absolute;right:6px;top:0;background:var(--pk);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 4px}
/* cards */
.cw{position:relative;flex:none}
.cb{position:absolute;left:0;top:0;width:300px;height:420px;transform-origin:0 0}
.tap{background:none;border:0;padding:0}
.glow{filter:drop-shadow(0 0 20px var(--g,#fff))}
.cw.dim{opacity:.4;filter:grayscale(.6)}
.cw.win{filter:drop-shadow(0 0 22px var(--gold));transform:translateY(-6px)}
.cw.cwin{filter:drop-shadow(0 0 22px var(--red));transform:translateY(-6px)}
.cw.lose{opacity:.5;filter:grayscale(.7)}
.cw{transition:transform .3s,opacity .3s}
.cw.flip{animation:flip .55s ease-out}
@keyframes flip{0%{transform:rotateY(90deg) scale(.9)}100%{transform:none}}
.badge{position:absolute;z-index:6;border-radius:99px;font-family:var(--hf);font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #000a}
.badge.new{background:#ff3b4e;color:#fff;font-family:var(--bf);font-weight:800;letter-spacing:.14em}
.badge.plus{background:#2fe08a;color:#06210f}
.badge.dupe{background:#ffd24d;color:#2a1a00;font-family:var(--bf);font-weight:800;letter-spacing:.1em}
/* hub */
.strip{margin:2px 14px 0;padding:8px 10px;gap:6px;display:flex;align-items:center;justify-content:space-between;min-height:68px}
.strip .mid{text-align:center}.strip small{display:block;font-size:10px;letter-spacing:.2em;font-weight:700;color:var(--sub)}
.strip b{font-family:var(--hf);font-size:19px;font-weight:700;line-height:1;white-space:nowrap}
.club{height:46px;width:auto}.cbadge{width:46px;height:46px;display:grid;place-items:center;font-family:var(--hf);font-weight:700;font-size:20px;background:var(--pan);border:var(--pb);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.cap{display:flex;justify-content:space-between;padding:8px 18px 2px;font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--sub)}
.form{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
.rowc{display:flex;gap:9px;justify-content:center}
.slot{background:none;border:0;padding:0;position:relative}
.slot .tag{position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:var(--gold);color:#2a1a00;font-size:9px;font-weight:800;border-radius:6px;padding:2px 6px;z-index:7;letter-spacing:.1em}
/* sheet */
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:30}
.sheet.on{display:flex}
.sheet .box{width:100%;max-height:78%;display:flex;flex-direction:column;background:#0c1226;border-top:1px solid rgba(255,255,255,.2);border-radius:24px 24px 0 0;padding:14px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sheet h3{text-align:center;font-family:var(--hf);font-size:26px;letter-spacing:.12em;margin-bottom:8px}
.list{overflow:auto;flex:1;display:grid;gap:8px;padding-bottom:10px}
.pr{display:flex;align-items:center;gap:12px;border:0;text-align:left;background:var(--pan);border-radius:14px;padding:6px 12px 6px 6px;width:100%}
.pr .t{flex:1}.pr b{display:block;font-family:var(--hf);font-size:24px;letter-spacing:.05em;font-weight:700;line-height:1}.pr small{color:var(--sub);font-size:11px;letter-spacing:.1em;font-weight:700}
.pr .o{font-family:var(--hf);font-size:36px;font-weight:700}
.pr.used{opacity:.5}
/* packs */
.packs{padding:6px 14px;display:flex;flex-direction:column;gap:12px;overflow:auto;flex:1}
.sec{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--sub);margin:6px 4px 0}
.pack{display:flex;align-items:center;gap:14px;padding:12px 14px}
.pk{width:62px;height:84px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--hf);font-size:34px;font-weight:700;background:linear-gradient(160deg,#35e0ff,#1b3a8a 60%,#0a1330);box-shadow:0 0 16px rgba(53,224,255,.4)}
.pk.pr2{background:linear-gradient(160deg,#ffe27a,#c47d00 60%,#3a2400);box-shadow:0 0 16px rgba(255,210,77,.45)}
.pack .t{flex:1}.pack b{display:block;font-family:var(--hf);font-size:28px;letter-spacing:.06em;line-height:1;font-weight:700}.pack small{color:var(--sub);font-size:12px;font-weight:600;display:block;margin-top:4px;line-height:1.3}
.pack .btn{height:46px;font-size:21px;padding:0 16px}
/* open */
.open{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0 10px;position:relative}
.open .stage2{flex:1;display:grid;place-items:center;position:relative;width:100%}
.beam{position:absolute;left:-30%;right:-30%;top:0;bottom:0;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(53,224,255,.15) 0 7deg,transparent 7deg 20deg);opacity:.9}
.beam2{position:absolute;inset:0;background:radial-gradient(55% 45% at 50% 45%,var(--rg,rgba(255,79,216,.35)),transparent 70%)}
.open .ban2{font-family:var(--hf);font-weight:700;font-size:38px;letter-spacing:.14em;padding:0 26px;text-align:center;line-height:1.1}
.mini{display:flex;gap:8px;justify-content:center;min-height:60px}
/* binder */
.chips{display:flex;gap:8px;padding:4px 14px}
.chip{height:30px;padding:0 14px;border-radius:15px;background:var(--pan);border:var(--pb);font-size:12px;font-weight:800;letter-spacing:.1em}
.chip.on{background:var(--gold);color:#2a1a00;border-color:transparent}
.bset{margin:8px 14px 0;padding:8px 14px;display:flex;align-items:center;gap:12px}
.bset b{font-family:var(--hf);font-size:26px;letter-spacing:.04em;font-weight:700;line-height:1;white-space:nowrap}
.bar0{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}.bar0 i{display:block;height:100%;background:var(--gold)}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 12px 14px;justify-items:center;align-content:start}
/* detail */
.det{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 14px 12px;gap:10px;overflow:auto}
.lvp{width:100%;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.lvp small{display:block;font-size:10px;letter-spacing:.16em;font-weight:800;color:var(--sub)}.lvp b{font-family:var(--hf);font-size:28px;font-weight:700;line-height:1.05}
.dups{display:flex;gap:6px}.dups i{width:34px;height:46px;border-radius:8px;border:2px dashed var(--sub);display:grid;place-items:center;font-style:normal;color:#2a1a00;font-weight:800}.dups i.f{background:var(--gold);border:0}
.sbar{width:100%;display:grid;gap:8px}
.sbar div{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700}.sbar span{width:34px;color:var(--sub);letter-spacing:.08em}.sbar em{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}.sbar em i{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}.sbar em u{position:absolute;top:0;bottom:0;background:#2fe08a}.sbar strong{width:62px;text-align:right}.sbar strong s{color:#2fe08a;text-decoration:none}
/* match */
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:8px 14px 0;padding:6px 12px;gap:6px;min-height:58px}
.tm{display:flex;align-items:center;gap:8px}.tm.cpu{justify-content:flex-end}
.tm b{font-family:var(--hf);font-size:36px;font-weight:700;line-height:1}.tm span{font-size:11px;font-weight:700;color:var(--sub)}
.tm .club{height:36px}.tm .cbadge{width:36px;height:36px;font-size:16px}
.qb{font-family:var(--hf);font-size:26px;font-weight:700;letter-spacing:.12em;padding:0 8px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 10px 6px}
.ttl{text-align:center;font-family:var(--hf);font-weight:700;font-size:28px;letter-spacing:.12em;line-height:1;min-height:26px}
.opp{display:grid;place-items:center;min-height:0}
.mine{display:flex;justify-content:center;gap:10px;width:100%}
.mine button{background:none;border:0;padding:0;transition:transform .15s,opacity .2s}
.mine button:active{transform:scale(.95)}
.mine button.lock{pointer-events:none}
.pips{display:flex;gap:10px;justify-content:center;margin-bottom:6px}
.pips i{width:16px;height:16px;transform:rotate(45deg);background:rgba(255,255,255,.18)}.pips i.m{background:var(--gold);box-shadow:0 0 10px var(--gold)}.pips i.c{background:var(--red);box-shadow:0 0 10px var(--red)}
.ban{text-align:center;font-family:var(--hf);font-size:30px;font-weight:700;letter-spacing:.06em;line-height:1;min-height:46px;display:grid;place-items:center;padding:0 8px}
.ban small{display:block;font-family:var(--bf);font-size:12px;letter-spacing:.06em;color:var(--sub);font-weight:700;margin-top:4px}.ban span{color:var(--gold)}
.plans{display:flex;gap:10px;width:100%;justify-content:center}
.plan{width:108px;min-height:136px;border-radius:16px;background:var(--pan);border:var(--pb);padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.plan i{width:32px;height:32px;background:var(--gold);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.plan b{font-family:var(--hf);font-size:25px;line-height:.95;letter-spacing:.03em;font-weight:700}.plan small{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--gold)}
.plan:active{background:linear-gradient(180deg,#ffe27a,#f0b800);color:#2a1a00}.plan:active small{color:#2a1a00}
.pop{position:relative;display:grid;place-items:center;min-height:0}
.pop .tx{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--hf);font-size:68px;font-weight:700;letter-spacing:.08em;text-shadow:0 4px 18px #000;animation:boom .5s ease-out}
.pop .tx.g{color:var(--gold)}.pop .tx.cg{color:var(--red)}.pop .tx.b{color:#cfd6df;font-size:40px}
@keyframes boom{0%{transform:scale(2.2);opacity:0}100%{transform:none;opacity:1}}
.log{display:grid;gap:5px;width:100%;font-size:13px;font-weight:700}
.log div{display:flex;justify-content:space-between;background:var(--pan);border:var(--pb);border-radius:10px;padding:6px 10px}.log .m b{color:var(--gold)}.log .c b{color:var(--red)}
.qs{display:grid;gap:8px;width:100%}.qs .l{display:flex;justify-content:space-between;align-items:center;background:var(--pan);border:var(--pb);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.qs .l b{font-family:var(--hf);font-size:24px;letter-spacing:.05em;font-weight:700}.qs .l.m b{color:var(--gold)}.qs .l.c b{color:var(--red)}
.big{display:flex;align-items:baseline;justify-content:center;gap:12px;font-family:var(--hf);font-weight:700;line-height:1;font-size:104px;text-shadow:0 0 30px rgba(255,210,77,.3)}
.big .bm{color:var(--gold)}.big .bv{font-size:30px;color:var(--sub)}.big .bc{color:#fff}
/* result */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 20px;text-align:center}
.res h2{font-family:var(--hf);font-size:120px;font-weight:700;line-height:.9;letter-spacing:.04em}
.res .sc{font-family:var(--hf);font-size:34px;font-weight:700;letter-spacing:.04em}.res .sc span{display:block;font-family:var(--bf);font-size:12px;color:var(--sub);letter-spacing:.1em;margin-top:2px}
.vsr{display:flex;align-items:center;justify-content:center;gap:16px}.vsr b{font-family:var(--hf);font-size:34px;color:var(--sub)}
.tops{display:flex;gap:8px;justify-content:center}
.rw{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.rw .pill{height:34px;font-size:14px}
</style>
</head>
<body>
<div id="app">
 <section class="screen on hn" id="sHub">
  <div class="tb"><h1 id="hClub">RICHMOND</h1><div class="pills"><div class="pill"><i></i><span id="hCoin">0</span></div><div class="pill pkp"><i></i><span id="hPk">0 packs</span></div></div></div>
  <div class="panel strip" id="hStrip"></div>
  <div class="cap"><span>YOUR SEVEN</span><span id="hRate"></span></div>
  <div class="form" id="form"></div>
  <div class="bar row2"><button class="btn" id="hPacks">PACKS</button><button class="btn main" id="hPlay">PLAY ROUND 1</button></div>
 </section>
 <section class="screen hn" id="sPacks">
  <div class="tb"><h1>PACKS</h1><div class="pills"><div class="pill"><i></i><span id="pCoin">0</span></div></div></div>
  <div class="packs" id="packBody"></div>
 </section>
 <section class="screen hn" id="sBind">
  <div class="tb"><h1>BINDER</h1><div class="pills"><div class="pill"><i></i><span id="bCount">0 / 54</span></div></div></div>
  <div class="chips" id="chips"></div>
  <div class="panel bset"><b>FOUNDATION SERIES</b><div class="bar0"><i id="bFill" style="width:0"></i></div></div>
  <div class="grid" id="grid"></div>
 </section>
 <section class="screen" id="sCard">
  <div class="tb"><button class="tap" id="cBack" style="font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--sub)">‹ BINDER</button><div></div></div>
  <div class="det" id="detBody"></div>
 </section>
 <section class="screen" id="sOpen">
  <div class="tb"><h1 id="oTitle">PACK</h1><div class="pills"><div class="pill"><i></i><span id="oCount">1 of 5</span></div></div></div>
  <div class="open" id="openBody"></div>
 </section>
 <section class="screen" id="sMatch">
  <div class="panel sb">
   <div class="tm me"><img class="club" src="assets/clubs/richmond.png" alt=""><b id="sMe">0.0</b><span id="sMeT">0</span></div>
   <div class="qb" id="qb">Q1</div>
   <div class="tm cpu"><span id="sCpuT">0</span><b id="sCpu">0.0</b><span id="lgCpu"></span></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bar"><button class="btn main" id="go">FIRST BOUNCE</button></div>
 </section>
 <section class="screen" id="sRes">
  <div class="res" id="resBody"></div>
  <div class="bar" id="resBar"></div>
 </section>
 <nav id="nav"><button data-s="sHub" class="on"><i></i>SQUAD</button><button data-s="sPacks"><i></i>PACKS<b id="nBadge" class="hide">0</b></button><button data-s="sBind"><i></i>BINDER</button><button data-s="play"><i></i>PLAY</button></nav>
 <div class="sheet" id="sheet"><div class="box"><h3 id="shTitle"></h3><div class="list" id="shList"></div><button class="btn" id="shClose">CANCEL</button></div></div>
</div>
<script src="cards.js"></script>
<script>
(function(){
"use strict";
var ST=window.ST,S={};ST.forEach(function(n,i){S[n]=i});
var $=function(i){return document.getElementById(i)};
var TIERS=[[90,"DIAMOND","#35e0ff","#ff4fd8"],[85,"RUBY","#ff3b4e","#ff9a8a"],[80,"AMETHYST","#b56bff","#e2c2ff"],[75,"SAPPHIRE","#4aa3ff","#bfe0ff"],[70,"EMERALD","#2fe08a","#b8ffd9"],[65,"TOPAZ","#ffc21a","#fff0a0"],[0,"QUARTZ","#d6dbe8","#ffffff"]];
function tierOf(o){for(var i=0;i<TIERS.length;i++)if(o>=TIERS[i][0])return TIERS[i]}
var POOL=window.CARDS.map(function(p){var pr=p[0].split(" ");return{name:p[0],first:pr[0],last:pr.slice(1).join(" "),club:p[1],pos:p[2],o0:p[3],s0:p[4],img:p[5]?"assets/players/"+p[5]:"",set:p[6]||"FND"}});
var BYNAME={};POOL.forEach(function(c){BYNAME[c.name]=c});
var CLUBN={CW:"COLLINGWOOD",BL:"BRISBANE",GE:"GEELONG",CA:"CARLTON",GW:"GWS",NM:"NORTH MELBOURNE",FR:"FREMANTLE",ES:"ESSENDON",HW:"HAWTHORN",SK:"ST KILDA",AD:"ADELAIDE",GC:"GOLD COAST",SY:"SYDNEY",ME:"MELBOURNE",RI:"RICHMOND",PA:"PORT ADELAIDE",WC:"WEST COAST",WB:"BULLDOGS"};
var OPPS=["ES","CW","GE","SY","BL","CA","ME","HW","PA","WB","FR","GC","SK","AD","WC","GW","NM"];
var ABB={"Kicking":"KICK","Tackling":"TKL","Hit-out":"HIT","Contested":"CNT","Clearance":"CLR","Spoil":"SPL","Rebound":"RBD","Forward mark":"FMK","Accuracy":"ACC"};
var PN={"Kicking":"LONG BOMBS","Tackling":"PRESSURE","Hit-out":"TAP WORK","Contested":"CONTESTED","Clearance":"CLEAN HANDS","Spoil":"LOCKDOWN","Rebound":"REBOUND RUN","Forward mark":"HIGH MARKS","Accuracy":"SHARP SHOOTING"};
var POS={RUC:["Kicking","Tackling","Hit-out","Contested"],MID:["Kicking","Tackling","Clearance","Contested"],DEF:["Kicking","Tackling","Spoil","Rebound"],FWD:["Kicking","Tackling","Forward mark","Accuracy"]};
var ROLES=["FWD","FWD","MID","RUC","MID","DEF","DEF"],LINEW=[1,1,.35,.35,.35,.05,.05];
var LINES=[{pos:"RUC",name:"RUCK",slots:[3]},{pos:"MID",name:"MIDFIELD",slots:[2,4]},{pos:"DEF",name:"DEFENCE",slots:[5,6]},{pos:"FWD",name:"FORWARD LINE",slots:[0,1]}];
var QT=["QUARTER TIME","HALF TIME","THREE QUARTER TIME","FULL TIME"];
/* ---------- save ---------- */

 var w=tm.map(function(c,i){return Math.pow(c.s[S["Scoring"]],2)*LINEW[i]}),tot=w.reduce(function(a,b){return a+b},0);
 for(var k=0;k<n;k++){var r=Math.random()*tot,i=0;while(i<6&&r>w[i]){r-=w[i];i++}var p=Math.max(.15,Math.min(.8,.32+.30*(tm[i].s[S["Accuracy"]]-35)/64+gauss()*.07));ev.push({side:side,c:tm[i],goal:Math.random()<p})}
 return ev}
function frame(){$("stage").innerHTML='<div class="ttl" id="ttl"></div><div class="opp" id="opp"></div><div><div class="pips" id="pips"></div><div class="ban" id="ban"></div></div><div class="mine" id="mine"></div>'}
function startMatch(){me=team();cpu=genCpu();newGame();var o=opp();$("lgCpu").innerHTML=clubImg(o,36);scoreboard();show("sMatch");
 $("stage").innerHTML='<div class="vsr" style="margin-top:12px">'+clubImg("RI",92)+'<b>V</b>'+clubImg(o,84)+'</div><div class="ttl">ROUND '+SAVE.round+' · '+CLUBN[o]+'</div><div class="qs">'+LINES.map(function(l,i){return'<div class="l"><span>Q'+(i+1)+'</span><b>'+l.name+'</b></div>'}).join("")+'</div><div class="ban">Pick a plan, then play your cards<small>Each quarter: 2 random stats. Higher number wins it.</small></div>';
 G.phase="start";buttons("FIRST BOUNCE ▶")}
function startQuarter(){G.q++;var ln=LINES[G.q-1];G.Q={ln:ln,stats:shuf(POS[ln.pos]).slice(0,2),res:[],my:lineOf(me,ln),cp:lineOf(cpu,ln),plan:{}};scoreboard();buttons(null);planScreen()}
function planScreen(){var Q=G.Q,a=Q.stats[0],b=Q.stats[1],ln=Q.ln,
 opts=[{n:PN[a],e:"+8 "+ABB[a],bn:[[a,8]]},{n:PN[b],e:"+8 "+ABB[b],bn:[[b,8]]},{n:"TEAM SHAPE",e:"+4 "+ABB[a]+" · +4 "+ABB[b],bn:[[a,4],[b,4]]}],w=Math.min(112,Math.floor((window.innerWidth-60)/Q.my.length/1.0));
 $("stage").innerHTML='<div class="ttl">QUARTER '+G.q+' · '+ln.name+'</div><div><div class="ban">PICK A PLAN<small>This quarter\'s stats: '+a.toUpperCase()+' and '+b.toUpperCase()+'</small></div></div><div class="plans">'+opts.map(function(o,i){return'<button class="plan" data-i="'+i+'"><i></i><b>'+o.n+'</b><small>'+o.e+'</small></button>'}).join("")+'</div><div class="ttl" style="font-size:18px;color:var(--sub)">YOUR '+(Q.my.length===1?'RUCK':ln.pos+'S')+'</div><div class="mine">'+Q.my.map(function(c){return card(c,Q.my.length===1?110:w>130?130:w,{stats:false})}).join("")+'</div>';
 [].forEach.call($("stage").querySelectorAll(".plan"),function(b){b.onclick=function(){opts[+b.dataset.i].bn.forEach(function(x){Q.plan[x[0]]=x[1]});frame();round(0)}})}
function round(r){var Q=G.Q,k=Q.stats[r],n=Q.my.length,bonus=Q.plan[k]||0,ln=Q.ln,mw=n===1?150:Math.min(158,Math.floor((window.innerWidth-40)/2)),ow=Math.max(100,Math.min(140,Math.floor((window.innerHeight-70-26-24-46-mw*1.4-48)/1.4)));
 if(r>=2)return quarterDone();
 $("ttl").textContent="QUARTER "+G.q+" · "+ln.name;pips(Q.res.map(function(x){return x.w}),2);
 banner((n===1?"PLAY YOUR RUCK FOR ":"PICK A "+ln.pos+" FOR ")+'<span>'+k.toUpperCase()+'</span>',"Round "+(r+1)+" of 2"+(bonus?" · plan +"+bonus:""));
 $("opp").innerHTML=card(cpuShow(Q.cp[0]),ow,{back:true,glow:"#ff4f6d"});
 $("mine").innerHTML=Q.my.map(function(c,i){return'<button data-i="'+i+'">'+card(c,mw,{act:k,plus:bonus})+'</button>'}).join("");
 [].forEach.call($("mine").querySelectorAll("button"),function(b){b.onclick=function(){
  var c=Q.my[+b.dataset.i];[].forEach.call($("mine").querySelectorAll("button"),function(x){x.classList.add("lock")});
  var oc=cpuPick(Q.cp,k),mv=sv(c,k)+bonus,ov=sv(oc,k),win=mv>ov?"m":mv<ov?"c":(Math.random()<.5?"m":"c");
  $("opp").innerHTML=card(oc,ow,{act:k,c:true,cls:"flip"+(win==="c"?" cwin":"")});
  b.querySelector(".cw").classList.add(win==="m"?"win":"lose");
  [].forEach.call($("mine").querySelectorAll("button"),function(x){if(x!==b)x.style.opacity=".35"});
  Q.res.push({w:win,x:nx(mv,ov)});pips(Q.res.map(function(x){return x.w}),2);
  banner(win==="m"?"YOU WIN IT":"THEY WIN IT",mv+"  v  "+ov);later(1500,function(){round(r+1)})}})}
function cpuShow(c){return c}
function quarterDone(){var Q=G.Q,wins=Q.res.filter(function(x){return x.w==="m"}).length,x=(Q.res[0].x+Q.res[1].x)/2,g=Math.max(-1,Math.min(1,x*1.3));
 if(G.q===4){var m=pts(G.me)-pts(G.cpu);if(m<-30)g+=.25;else if(m>30)g-=.15}
 var win=wins>1?"me":wins<1?"cpu":(x>0?"me":x<0?"cpu":(Math.random()<.5?"me":"cpu")),upset=Math.random()<.12,tries=0,ev,qo;
 do{ev=shoot(me,g,"me").concat(shoot(cpu,-g,"cpu"));qo={me:{g:0,b:0},cpu:{g:0,b:0}};ev.forEach(function(e){var t=qo[e.side];if(e.goal)t.g++;else t.b++});tries++}
 while(!upset&&tries<60&&(win==="me"?pts(qo.me)<=pts(qo.cpu):pts(qo.cpu)<=pts(qo.me)));
 Q.ev=shuf(ev);Q.qo={me:{g:0,b:0},cpu:{g:0,b:0}};Q.i=0;scoring()}
function scoring(){$("stage").innerHTML='<div class="ttl">'+QT[G.q-1]+'</div><div class="pop" id="pop"></div><div class="log" id="log"></div><div></div>';buttons("SKIP ▶");G.phase="skip";tick()}
function tick(){var Q=G.Q;if(G.phase!=="skip")return;if(Q.i>=Q.ev.length)return summary();
 var e=Q.ev[Q.i++];apply(e,Q.qo);var m=e.side==="me",pw=Math.max(120,Math.min(160,Math.floor((window.innerHeight-330)/1.4)));
 $("pop").innerHTML=card(e.c,pw,{cls:"flip",stats:false})+'<div class="tx '+(e.goal?(m?"g":"cg"):"b")+'">'+(e.goal?"GOAL!":"BEHIND")+'</div>';
 var l=document.createElement("div");l.className=m?"m":"c";l.innerHTML='<span>'+e.c.last+(e.goal?' goal':' behind')+'</span><b>'+pts(G.me)+' – '+pts(G.cpu)+'</b>';var lg=$("log");lg.insertBefore(l,lg.firstChild);while(lg.children.length>3)lg.removeChild(lg.lastChild);
 later(560,tick)}
function summary(){var Q=G.Q;G.phase="next";var last=G.q>=4,a=pts(G.me),b=pts(G.cpu),o=opp();
 $("stage").innerHTML='<div class="ttl">'+QT[G.q-1]+'</div><div class="big"><span class="bm">'+Q.qo.me.g+'.'+Q.qo.me.b+'</span><span class="bv">v</span><span class="bc">'+Q.qo.cpu.g+'.'+Q.qo.cpu.b+'</span></div><div class="ttl" style="font-size:18px;color:var(--sub)">THIS QUARTER</div><div class="qs"><div class="l m"><span>RICHMOND</span><b>'+G.me.g+'.'+G.me.b+' ('+a+')</b></div><div class="l c"><span>'+CLUBN[o]+'</span><b>'+G.cpu.g+'.'+G.cpu.b+' ('+b+')</b></div></div><div class="ttl" style="color:var(--gold)">'+(a>b?"YOU LEAD BY "+(a-b):a<b?"YOU TRAIL BY "+(b-a):"ALL SQUARE")+'</div><div></div>';
 buttons(last?"FULL TIME ▶":"QUARTER "+(G.q+1)+" · "+LINES[G.q].name+" ▶")}
$("go").onclick=function(){var p=G.phase;
 if(p==="start"||p==="next"){if(p==="next"&&G.q>=4){G.done=true;scoreboard();finish()}else{G.phase="";startQuarter()}}
 else if(p==="skip"){var Q=G.Q;G.phase="";while(Q.i<Q.ev.length)apply(Q.ev[Q.i++],Q.qo);summary()}};
function finish(){var a=pts(G.me),b=pts(G.cpu),res=a>b?"WIN":a<b?"LOSS":"DRAW",o=opp(),coins=res==="WIN"?350:res==="DRAW"?200:120,rw=[];
 coins+=G.me.g*10;SAVE.coins+=coins;rw.push("+"+coins+" coins");
 if(res==="WIN"){SAVE.wins++;SAVE.streak++;SAVE.packs.std++;rw.push("+1 Standard pack");if(SAVE.wins%5===0){SAVE.packs.prem++;rw.push("+1 Premium pack")}}else if(res==="LOSS")SAVE.streak=0;
 SAVE.round++;save();
 var all=Object.keys(G.scorers.me).map(function(n){return G.scorers.me[n]}).sort(function(x,y){return y.g*6+y.b-(x.g*6+x.b)});
 $("resBody").innerHTML='<div class="vsr">'+clubImg("RI",64)+'<b>V</b>'+clubImg(o,58)+'</div><h2 style="color:'+(res==="WIN"?"var(--gold)":res==="LOSS"?"var(--red)":"#fff")+'">'+res+'</h2><div class="sc">'+G.me.g+'.'+G.me.b+' ('+a+') &nbsp;v&nbsp; '+G.cpu.g+'.'+G.cpu.b+' ('+b+')<span>'+(a===b?"Dead heat":"Margin "+Math.abs(a-b)+" points")+'</span></div><div class="tops">'+all.slice(0,3).map(function(x){return'<div style="text-align:center">'+card(x.c,96,{stats:false})+'<div class="pill" style="margin-top:8px;justify-content:center">'+x.g+'.'+x.b+'</div></div>'}).join("")+'</div><div class="rw">'+rw.map(function(t){return'<div class="pill"><i></i>'+t+'</div>'}).join("")+'</div>';
 var np=SAVE.packs.std+SAVE.packs.prem;
 $("resBar").className="bar"+(np?" row2":"");$("resBar").innerHTML=(np?'<button class="btn" id="rPk">PACKS ('+np+')</button>':'')+'<button class="btn main" id="rNext">NEXT ROUND ▶</button>';
 if(np)$("rPk").onclick=function(){go("sPacks")};$("rNext").onclick=function(){go("sHub")};
 show("sRes")}
function onResize(){drawIfHub()}
function drawIfHub(){if($("sHub").classList.contains("on"))drawHub()}
window.addEventListener("resize",onResize);
SAVE=load();save();drawHub();show("sHub");
window.__dbg={get G(){return G},get SAVE(){return SAVE},POOL:POOL,go:go};
})();
